<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>تقرير الأداء</title>
<!-- Google Fonts عبر link — آمن على iOS/Safari -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════ متغيرات ═══════════════ */
:root {
  --bg:        #07101c;
  --bg2:       #0b192a;
  --card:      #0e2135;
  --border:    rgba(25,65,105,0.55);
  --border2:   rgba(40,90,145,0.65);
  --border-hi: rgba(77,184,255,0.14);
  --txt:       #ddeeff;
  --txt-dim:   #8ab8d8;
  --muted:     #4a7da8;
  --red:    #ff5f6b;  --red-g:    rgba(255,95,107,0.3);
  --amber:  #f9c74f;  --amber-g:  rgba(249,199,79,0.3);
  --green:  #3dd68c;  --green-g:  rgba(61,214,140,0.3);
  --teal:   #2de0d4;  --teal-g:   rgba(45,224,212,0.3);
  --blue:   #4db8ff;  --blue-g:   rgba(77,184,255,0.3);
  --purple: #b197fc;  --purple-g: rgba(177,151,252,0.3);
  --font: 'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --top-h: 54px;
  --nav-h: 56px;
  --r:     13px;
}
body.light {
  --bg:#f0f4f9; --bg2:#e2ecf5; --card:#ffffff;
  --border:rgba(170,200,235,0.8); --border2:rgba(130,170,215,0.8);
  --border-hi:rgba(77,184,255,0.18);
  --txt:#0c1a28; --txt-dim:#2a4560; --muted:#365f80;
  --red-g:rgba(200,40,50,.12); --green-g:rgba(30,160,90,.12);
  --blue-g:rgba(30,100,200,.12); --amber-g:rgba(200,140,20,.12);
  --teal-g:rgba(20,180,170,.12); --purple-g:rgba(130,100,230,.12);
}

/* ═══════════════ Base ═══════════════ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--txt);
  direction: rtl;
  transition: background .3s, color .3s;
  /* fallback ثابت — آمن إذا لم تُحلَّ CSS variables */
  padding-top: 110px;
  padding-top: calc(var(--top-h) + var(--nav-h));
  min-height: 100vh;
  /* overflow-x:hidden محذوف — يجمّد التمرير على iOS Safari */
}

/* Scrollbar */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
* { scrollbar-width:thin; scrollbar-color:var(--border2) transparent; }

/* ═══════════════ Topbar ═══════════════ */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:1001;
  height:var(--top-h);
  background:rgba(11,25,42,.92);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border-hi);
  padding:0 10px;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
}
body.light .topbar { background:rgba(224,236,245,.93); }
.topbar-info { min-width:0; flex:1; overflow:hidden; }
.topbar-title {
  font-size:12px; font-weight:700; color:var(--txt);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-sub { font-size:9px; color:var(--muted); margin-top:1px; white-space:nowrap; }
.topbar-actions { display:flex; gap:4px; align-items:center; flex-shrink:0; }
.theme-btn {
  background:var(--card); border:1px solid var(--border2); color:var(--muted);
  padding:4px 9px; border-radius:20px; font-size:10px; cursor:pointer;
  font-family:var(--font); transition:all .2s;
}
.theme-btn:hover { border-color:var(--blue); color:var(--blue); }

/* ═══════════════ Week Selector ═══════════════ */
.week-selector { position:relative; }
.week-btn {
  display:flex; align-items:center; gap:3px;
  background:rgba(77,184,255,.1); border:1px solid rgba(77,184,255,.35);
  color:var(--blue); padding:4px 9px; border-radius:20px;
  font-size:10px; font-weight:600; cursor:pointer; font-family:var(--font);
  transition:all .2s; white-space:nowrap;
}
.week-btn:hover { background:rgba(77,184,255,.18); }
.week-btn .caret { font-size:9px; opacity:.7; transition:transform .2s; }
.week-btn.open .caret { transform:rotate(180deg); }
.week-dropdown {
  position:absolute; top:calc(100% + 8px); left:0;
  min-width:185px; background:var(--card);
  border:1px solid var(--border2); border-radius:var(--r);
  max-height:min(420px,75vh); overflow-y:auto; overscroll-behavior:contain; z-index:2000;
  box-shadow:0 14px 36px rgba(0,0,0,.55);
  opacity:0; transform:translateY(-6px) scale(.98);
  pointer-events:none; transition:opacity .17s, transform .17s;
  scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
}
.week-dropdown.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
body.light .week-dropdown { box-shadow:0 8px 24px rgba(0,0,0,.14); }
.wk-opt {
  padding:11px 16px; font-size:12px; cursor:pointer; color:var(--txt-dim);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--border); transition:background .13s;
}
.wk-opt:last-child { border-bottom:none; }
.wk-opt:hover { background:rgba(77,184,255,.08); color:var(--txt); }
.wk-opt.sel { color:var(--blue); background:rgba(77,184,255,.1); font-weight:600; }
.wk-opt .wk-chk { opacity:0; transition:opacity .13s; font-size:11px; }
.wk-opt.sel .wk-chk { opacity:1; }

/* ═══════════════ Quick Nav ═══════════════ */
.quick-nav {
  position:fixed; top:var(--top-h); left:0; right:0; z-index:999;
  height:var(--nav-h);
  background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:2px;
  overflow-x:auto; padding:0 10px;
  -webkit-overflow-scrolling:touch;
}
.quick-nav::-webkit-scrollbar { display:none; }
.quick-nav { scrollbar-width:none; }
.nav-item {
  display:flex; align-items:center; gap:5px;
  padding:7px 11px; border-radius:8px; cursor:pointer;
  white-space:nowrap; font-size:11px; font-weight:600;
  color:var(--muted); border:1px solid transparent;
  transition:all .2s; flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:hover { background:rgba(77,184,255,.08); color:var(--blue); border-color:rgba(77,184,255,.2); }
.nav-item.active { background:rgba(77,184,255,.13); color:var(--blue); border-color:rgba(77,184,255,.3); }
.nav-icon { font-size:14px; line-height:1; }

/* ═══════════════ Content & Footer ═══════════════ */
.content { padding:14px 16px; width:100%; }
.footer {
  border-top:1px solid var(--border); padding:12px 16px;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
  font-size:10px; color:var(--muted); background:var(--bg2);
}

/* ═══════════════ Section Headers — قابلة للطي ═══════════════ */
.sec-hdr {
  color:var(--muted); font-size:11px; font-weight:700;
  letter-spacing:.9px; text-transform:uppercase;
  margin:26px 0 0;
  display:flex; align-items:center; gap:10px;
  cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
  scroll-margin-top:calc(var(--top-h) + var(--nav-h) + 8px);
  transition:color .2s;
}
.sec-hdr:hover { color:var(--txt-dim); }
.sec-hdr::after { content:''; flex:1; height:1px; background:linear-gradient(to left,transparent,var(--border)); }
.sec-emoji { font-size:16px; }
/* سهم الطي */
.sec-arrow {
  font-size:13px; color:var(--muted); opacity:.6;
  transition:transform .3s, opacity .2s; flex-shrink:0;
}
.sec-hdr.collapsed .sec-arrow { transform:rotate(-90deg); opacity:.4; }

/* محتوى القسم — يُطوى بسلاسة */
.sec-body {
  max-height:4000px;
  overflow:hidden;
  transition:max-height .38s ease, opacity .3s ease;
  opacity:1;
  margin-bottom:4px;
}
.sec-body.collapsed { max-height:0; opacity:0; }

/* ═══════════════ KPI Grid ═══════════════ */
.kpi-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(128px,1fr));
  gap:10px; margin:12px 0;
}
.kpi {
  background:var(--card);
  border:1px solid var(--border-hi);
  /* border-top accent — يُعيَّن بواسطة :has() */
  border-top:2px solid var(--kpi-c, var(--border));
  border-radius:var(--r);
  padding:13px 14px;
  position:relative; overflow:hidden;
  transition:transform .15s, box-shadow .15s;
}
/* تأثير التمييز الداخلي */
.kpi::after {
  content:''; position:absolute;
  top:0; right:0; bottom:0; left:0;  /* بديل inset:0 — لدعم iOS<14.1 */
  border-radius:var(--r);
  background:linear-gradient(135deg,rgba(255,255,255,.032) 0%,transparent 55%);
  pointer-events:none;
}
.kpi:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.28); }
.kpi-label { color:var(--txt-dim); font-size:10px; font-weight:500; line-height:1.4; opacity:.82; }
.kpi-row { display:flex; align-items:baseline; gap:8px; margin-top:7px; }
.kpi-val { font-size:26px; font-weight:800; line-height:1; letter-spacing:-.5px; }

/* ألوان القيم */
.v-r { color:var(--red);    text-shadow:0 0 14px var(--red-g); }
.v-g { color:var(--green);  text-shadow:0 0 14px var(--green-g); }
.v-a { color:var(--amber);  text-shadow:0 0 14px var(--amber-g); }
.v-t { color:var(--teal);   text-shadow:0 0 14px var(--teal-g); }
.v-b { color:var(--blue);   text-shadow:0 0 14px var(--blue-g); }
.v-p { color:var(--purple); text-shadow:0 0 14px var(--purple-g); }

/* حدود KPI ملونة حسب القيمة */
.kpi:has(.v-r) { --kpi-c:rgba(255,95,107,.4); }
.kpi:has(.v-g) { --kpi-c:rgba(61,214,140,.4); }
.kpi:has(.v-b) { --kpi-c:rgba(77,184,255,.4); }
.kpi:has(.v-t) { --kpi-c:rgba(45,224,212,.4); }
.kpi:has(.v-a) { --kpi-c:rgba(249,199,79,.4); }
.kpi:has(.v-p) { --kpi-c:rgba(177,151,252,.4); }

/* مؤشر الاتجاه (▲/▼) */
.kpi-trend {
  font-size:10px; font-weight:700; letter-spacing:-.3px;
  padding:1px 5px; border-radius:5px;
}
.trend-up { color:var(--blue);  background:rgba(77,184,255,.1); }
.trend-dn { color:var(--muted); background:rgba(77,184,255,.06); }

/* ═══════════════ Chart Grid ═══════════════ */
.chart-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(560px,100%),1fr));
  gap:12px; margin-bottom:12px;
}
.chart-card {
  background:var(--card); border:1px solid var(--border-hi);
  border-radius:var(--r); padding:15px; overflow:hidden;
}
.chart-card-title {
  font-size:11px; font-weight:600; margin-bottom:12px;
  color:var(--txt-dim); display:flex; align-items:center; gap:6px;
}
.chart-zoom {
  overflow-x:auto; overflow-y:hidden;
  touch-action:pan-x; -webkit-overflow-scrolling:touch;
  cursor:grab; width:100%; border-radius:6px;
  scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
}
.chart-zoom::-webkit-scrollbar { height:4px; }
.chart-zoom::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.chart-zoom:active { cursor:grabbing; }
.chart-wrap { position:relative; }

/* ═══════════════ Tables ═══════════════ */
.tbl-wrap {
  overflow-x:auto; border-radius:11px;
  border:1px solid var(--border); background:var(--card);
  margin-bottom:16px; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
}
.tbl-wrap::-webkit-scrollbar { height:4px; }
.tbl-wrap::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th {
  background:var(--bg2); color:var(--muted); font-weight:600;
  padding:10px 8px; border-bottom:2px solid var(--border);
  text-align:center; font-size:11px; white-space:nowrap;
}
td {
  padding:9px 8px; border-bottom:1px solid var(--border);
  text-align:center; transition:background .13s;
}
tr:last-child td { border-bottom:none; }
tbody tr:hover td { background:rgba(77,184,255,.05); }
tbody tr:hover td:first-child { background:rgba(77,184,255,.08); }
td:first-child, th:first-child {
  text-align:right; position:sticky; right:0;
  background:var(--card); font-weight:600;
  width:120px; min-width:100px;
  box-shadow:-3px 0 10px -2px rgba(0,0,0,.3);
  border-left:1px solid var(--border2);
}
th:first-child { background:var(--bg2); z-index:4; }
td:first-child  { z-index:2; }
.w-last { font-weight:700; color:var(--blue); }

/* ═══════════════ Animations ═══════════════ */
/* fadeIn بدون translateY — لتجنب طبقات GPU الزائدة على iOS */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.sec-hdr { animation:fadeIn .3s ease both; }
.kpi     { animation:fadeIn .35s ease both; }

/* ═══════════════ Media Queries ═══════════════ */
@media (max-width:640px) {
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .chart-grid { grid-template-columns:1fr; }
  .kpi-val { font-size:22px; }
  td:first-child, th:first-child { width:96px; min-width:80px; font-size:10px; }
  .content { padding:10px 10px; }
  :root { --nav-h:50px; --top-h:46px; }
  body { padding-top:96px; padding-top:calc(var(--top-h) + var(--nav-h)); }
  .nav-item { padding:6px 9px; font-size:10px; }
  .topbar-title { font-size:11px; }
  .topbar-sub { display:none; }
  .topbar { padding:0 8px; gap:3px; }
  .topbar-actions { gap:3px; }
  .week-btn { padding:3px 7px; font-size:9px; gap:2px; }
  .theme-btn { padding:3px 7px; font-size:9px; }
}

@media (max-width:480px) {
  .topbar-title { font-size:10px; }
  .week-btn { padding:2px 5px; font-size:8px; gap:1px; }
  .theme-btn { padding:2px 5px; font-size:8px; }
  .topbar { padding:0 6px; gap:2px; }
  .topbar-actions { gap:2px; }
}
@media (max-width:380px) {
  td:first-child, th:first-child { width:82px; font-size:9px; }
  .kpi-label { font-size:9px; }
  .kpi-val { font-size:20px; }
}

/* ═══════════════ Light mode overrides ═══════════════ */
body.light .kpi { background:#fff; }
body.light .chart-card { background:#fff; }
body.light td:first-child { background:#fff; }
body.light th:first-child { background:var(--bg2); }
body.light .v-r,.v-g,.v-b,.v-t,.v-a,.v-p { text-shadow:none; }
body.light .kpi-trend { text-shadow:none; }

/* زيادة عرض بطاقات KPI لاستيعاب الأرقام مع الكسور وسهم التغيير */
.kpi-grid {
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 12px;
}

@media (max-width: 640px) {
  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .kpi {
    padding: 12px 10px;
  }
  .kpi-val {
    font-size: 20px;
  }
  .kpi-row {
    gap: 6px;
  }
}

@media (max-width: 480px) {
  .kpi-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .kpi {
    padding: 10px 8px;
  }
  .kpi-val {
    font-size: 18px;
  }
  .kpi-trend {
    font-size: 9px;
    padding: 2px 4px;
    white-space: nowrap;
  }
}

/* تحسين مظهر سهم التغيير ليشغل مساحة أقل */
.kpi-trend {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 12px;
  display: inline-block;
  white-space: nowrap;
}

/* الحل القوي لمشكلة التمرير على iOS */
html, body {
  overflow-y: auto !important;
  position: relative;
  height: auto;
  min-height: 100vh;
}

body {
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch !important;
}

/* منع أي عنصر من اعتراض التمرير */
.chart-zoom,
.chart-wrap,
svg,
.tbl-wrap,
.quick-nav {
  pointer-events: auto;
  touch-action: pan-x pan-y !important;
}

/* إعادة تعيين overflow لجميع الحاويات */
div:not(.chart-zoom):not(.tbl-wrap):not(.quick-nav):not(.week-dropdown):not(.month-dropdown) {
  overflow: visible;
}

/* ═══════════════ الترقية العصريّة ═══════════════ */

/* تبديل العرض أسبوعي/شهري */
.view-toggle {
  display:flex; align-items:center; gap:2px;
  background:var(--bg2); border:1px solid var(--border);
  border-radius:20px; padding:3px; flex-shrink:0;
}
.vt-btn {
  border:none; background:transparent; color:var(--muted);
  font-family:var(--font); font-size:10px; font-weight:600;
  padding:4px 11px; border-radius:16px; cursor:pointer;
  transition:all .2s; -webkit-tap-highlight-color:transparent;
}
.vt-btn.active {
  background:rgba(77,184,255,.16); color:var(--blue);
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.vt-divider { width:1px; height:14px; background:var(--border2); opacity:.5; }

/* منتقي الشهور (نمط الشهر الأخضر) */
.month-selector{position:relative;}
.month-btn{display:flex;align-items:center;gap:5px;background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.3);color:var(--green);padding:6px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;white-space:nowrap;}
.month-btn:hover{background:rgba(61,214,140,.14);}
.month-btn .caret2{font-size:8px;opacity:.6;transition:transform .2s;}.month-btn.open .caret2{transform:rotate(180deg);}
.month-dropdown{position:absolute;top:calc(100% + 7px);left:0;min-width:155px;background:var(--card2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;z-index:2000;box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .16s,transform .16s;}
.month-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.mo-opt{padding:9px 14px;font-size:12px;cursor:pointer;color:var(--txt-dim);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);transition:background .13s;}
.mo-opt:last-child{border-bottom:none;}.mo-opt:hover{background:rgba(61,214,140,.07);color:var(--txt);}
.mo-opt.sel{color:var(--green);background:rgba(61,214,140,.09);font-weight:600;}
.mo-opt .mo-chk{opacity:0;font-size:10px;}.mo-opt.sel .mo-chk{opacity:1;}

/* النظرة العامة السريعة */
.quick-overview {
  margin:2px 0 18px;
  border:1px solid var(--border-hi);
  border-radius:var(--r);
  background:linear-gradient(160deg,var(--card) 0%,var(--bg2) 100%);
  padding:14px 16px 16px;
  position:relative; overflow:hidden;
}
.quick-overview::before {
  content:''; position:absolute; top:-60px; left:-60px;
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle,rgba(77,184,255,.12),transparent 70%);
  pointer-events:none;
}
.quick-overview-hdr {
  display:flex; align-items:center; gap:8px;
  font-size:12px; font-weight:700; color:var(--txt-dim);
  margin-bottom:12px;
}
.quick-overview-hdr .upd-badge {
  margin-right:auto; font-size:9px; font-weight:600;
  color:var(--blue); background:rgba(77,184,255,.12);
  border:1px solid rgba(77,184,255,.25);
  padding:2px 9px; border-radius:12px; white-space:nowrap;
}
.quick-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.quick-card {
  background:var(--card); border:1px solid var(--border-hi);
  border-radius:11px; padding:11px 13px;
  position:relative; overflow:hidden;
  border-top:2px solid var(--qc-c,var(--border2));
  transition:transform .15s, box-shadow .15s;
}
.quick-card:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.28); }
.quick-card::after {
  content:''; position:absolute; inset:0;
  border-radius:11px;

.quick-card-sub .q-dn  { color:var(--red); }

/* شارة قسم محدث */
.update-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:9px; font-weight:700; color:var(--blue);

  padding:1px 8px; border-radius:10px;
  margin-inline-start:auto; white-space:nowrap;
}

/* قيمة إحصائية صغيرة داخل KPI (avg/min/max) */
.kpi-stats {
  display:flex; gap:8px; margin-top:7px; flex-wrap:wrap;
}
.kpi-stat {
  font-size:8.5px; color:var(--muted); line-height:1.3;

/* تحسين سهم الاتجاه في KPI */
.kpi-trend {

}
.trend-up { color:var(--green); background:rgba(61,214,140,.13); }
.trend-dn { color:var(--red);  background:rgba(255,95,107,.13); }
.trend-flat { color:var(--muted); background:rgba(122,138,158,.12); }

/* نظرة عامة شهرية */
.month-summary {
  border:1px solid var(--border-hi); border-radius:var(--r);
  background:var(--card); padding:14px 16px; margin-bottom:18px;
}
.month-summary-hdr {
  font-size:12px; font-weight:700; color:var(--txt-dim);

}
.month-summary-hdr .update-badge { margin-inline-start:auto; }
.month-chip-grid {
  display:grid; gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
}
.month-chip {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:10px; padding:9px 12px;
  display:flex; align-items:center; gap:10px;
  cursor:pointer; transition:all .18s;
}
.month-chip:hover { border-color:rgba(77,184,255,.35); transform:translateY(-1px); }
.month-chip.sel { border-color:var(--blue); background:rgba(77,184,255,.1); }
.mchip-name { font-size:11px; font-weight:700; color:var(--txt); }
.mchip-wks  { font-size:9px; color:var(--muted); margin-top:1px; }
.mchip-arrow{ margin-inline-start:auto; color:var(--blue); font-size:12px; }

/* وضع شهري: بطاقات ملخص */
.mpanel-grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
.mpanel {
  background:var(--card); border:1px solid var(--border-hi);
  border-radius:11px; padding:12px 14px;
  border-top:2px solid var(--mp-c,var(--border2));
}
.mpanel-title { font-size:10px; font-weight:600; color:var(--txt-dim); }
.mpanel-row { display:flex; align-items:baseline; gap:6px; margin-top:6px; }
.mpanel-val { font-size:20px; font-weight:800; line-height:1; }
.mpanel-sub { font-size:9px; color:var(--muted); margin-top:4px; }
.mpanel-vs  { font-size:9px; color:var(--muted); margin-top:2px; }
.mpanel-vs b { color:var(--txt-dim); }
.mpanel-vs .q-up { color:var(--green); } .mpanel-vs .q-dn { color:var(--red); }

/* توهج على hover لبطاقات الرسم */
.chart-card { transition:box-shadow .2s, border-color .2s; }
.chart-card:hover { border-color:rgba(77,184,255,.3); box-shadow:0 10px 30px rgba(0,0,0,.22); }

/* شارة الزر: تنبيه لطيف */
@keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.35} }
.pulse-dot {
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--green); margin-inline-start:2px;
  animation:pulseDot 2s infinite;
}

</style>
</head>

<script src="data.js"></script>
<script>

var LW           = WEEKS[WEEKS.length - 1];
var PW           = WEEKS.length >= 2 ? WEEKS[WEEKS.length - 2] : null; /* الأسبوع السابق للمقارنة */
var isLight      = false;
var visibleCount = WEEKS.length;
var viewMode     = 'weekly';     /* weekly | monthly */
var selectedMonth = null;        /* null = كل الشهور */

/* ════ أنواع الحقول للتجميع الشهري ════ */
var FIELD_TYPE={
  'quality.se_mre':'sum','quality.incident':'sum','quality.good_catch':'sum',
  'emergency.ctas12':'sum','emergency.ctas3':'sum','emergency.ctas45':'sum',
  'surgery.emergency':'sum','surgery.routine':'sum','surgery.waiting':'last',
  'surgery.cancelled':'sum','surgery.cancel_reason':'text',
  'clinics.total':'sum','clinics.virtual':'sum','clinics.no_show':'sum','clinics.no_show_pct':'avg',
  'satisfaction.all':'avg','satisfaction.ed':'avg','satisfaction.clinics':'avg','satisfaction.inpatient':'avg',
  'complaints.closed':'sum','complaints.not_closed':'sum',
  'capacity.inpatients':'sum','capacity.bed_occ':'avg',
  'capacity.lifesaving':'sum','capacity.emergency_ref':'sum','capacity.routine_ref':'sum',
  'screening.breast':'sum','screening.breast_pos':'sum','screening.colon':'sum','screening.colon_pos':'sum',
  'screening.stemi_total':'sum','screening.stemi_out':'sum','screening.stroke_total':'sum','screening.stroke_out':'sum',
  'pharmacy.inpatient':'sum','pharmacy.clinics':'sum','pharmacy.emergency':'sum',
  'home_care.visits':'sum',
  'endoscopy.appoint':'sum','endoscopy.procedures':'sum'
};

/* ════ بناء بيانات شهرية ════ */
function buildMonthlyData(){
  var groups = {}, order = [];
  WEEKS.forEach(function(w){
    var m = w.month;
    if(!groups[m]){ groups[m] = []; order.push(m); }
    groups[m].push(w);
  });
  var seen = {}, ordU = [];
  order.forEach(function(m){ if(!seen[m]){ seen[m]=1; ordU.push(m); } });
  ordU = ordU.filter(function(m){ return groups[m].length >= 1; });
  return ordU.map(function(m){
    var wks = groups[m];
    function gv(w,path){ var p=path.split('.'); var o=w; for(var i=0;i<p.length;i++){ o=o?o[p[i]]:undefined; } return o; }
    function agg(path){
      var type = FIELD_TYPE[path] || 'sum';
      var nums = wks.map(function(w){ var v=gv(w,path); return (v===null||v===undefined||v==='-'||v==='\u2014'||v==='_')?null:+v; }).filter(function(v){ return v!==null&&!isNaN(v); });
      if(!nums.length) return 0;
      if(type==='sum') return nums.reduce(function(a,b){ return a+b; }, 0);
      if(type==='avg'){ var s=nums.reduce(function(a,b){ return a+b; }, 0); return Math.round(s/nums.length*10)/10; }
      if(type==='last') return nums[nums.length-1];
      return 0;
    }
    return {
      label: m, month: m, _wkCount: wks.length,
      dateRange: wks[0].dateRange.split('-')[0]+' \u2013 '+wks[wks.length-1].dateRange.split('-').pop(),
      quality:{se_mre:agg('quality.se_mre'), incident:agg('quality.incident'), good_catch:agg('quality.good_catch')},
      emergency:{ctas12:agg('emergency.ctas12'), ctas3:agg('emergency.ctas3'), ctas45:agg('emergency.ctas45')},
      surgery:{emergency:agg('surgery.emergency'), routine:agg('surgery.routine'), waiting:agg('surgery.waiting'), cancelled:agg('surgery.cancelled'), cancel_reason:(function(){
        var reasons = wks.map(function(w){ return gv(w,'surgery.cancel_reason')||''; }).filter(function(v){ return v&&v!=='\u2014'&&v!=='-'&&v!=='_'; });
        if(!reasons.length) return '\u2014';
        var c={};
        function normCat(t){ return /^med\.?\s*ind/i.test(t) ? 'Medical Indication' : t; }
        reasons.forEach(function(r){
          if(r.indexOf('+')>0){ r.split('+').forEach(function(p){ var m=p.match(/^(\d+)\s*(.+)/); if(m){ var t=normCat(m[2].trim()); c[t]=(c[t]||0)+parseInt(m[1]); } else { var t=normCat(p.trim()); c[t]=(c[t]||0)+1; } }); }
          else if(r.indexOf('-')>0){ r.split(/\s*-\s*/).forEach(function(p){ var t=normCat(p.trim()); c[t]=(c[t]||0)+1; }); }
          else { var t=normCat(r.trim()); c[t]=(c[t]||0)+1; }
        });
        return Object.keys(c).map(function(k){ return c[k]+' '+k; }).join('+');
      })()},
      clinics:{total:agg('clinics.total'), virtual:agg('clinics.virtual'), no_show:agg('clinics.no_show'), no_show_pct:agg('clinics.no_show_pct')},
      satisfaction:{all:agg('satisfaction.all'), ed:agg('satisfaction.ed'), clinics:agg('satisfaction.clinics'), inpatient:agg('satisfaction.inpatient')},
      complaints:{closed:agg('complaints.closed'), not_closed:agg('complaints.not_closed')},
      capacity:{inpatients:agg('capacity.inpatients'), bed_occ:agg('capacity.bed_occ'), lifesaving:agg('capacity.lifesaving'), emergency_ref:agg('capacity.emergency_ref'), routine_ref:agg('capacity.routine_ref')},
      screening:{breast:agg('screening.breast'), breast_pos:agg('screening.breast_pos'), colon:agg('screening.colon'), colon_pos:agg('screening.colon_pos'), stemi_total:agg('screening.stemi_total'), stemi_out:agg('screening.stemi_out'), stroke_total:agg('screening.stroke_total'), stroke_out:agg('screening.stroke_out')},
      pharmacy:{inpatient:agg('pharmacy.inpatient'), clinics:agg('pharmacy.clinics'), emergency:agg('pharmacy.emergency')},
      home_care:{visits:agg('home_care.visits')},
      endoscopy:{appoint:agg('endoscopy.appoint'), procedures:agg('endoscopy.procedures')}
    };
  });
}

function getVW(){
  if(viewMode==='monthly') {
    var allMonths = buildMonthlyData();
    if(!allMonths || allMonths.length === 0) { return WEEKS.slice(-1); }
    if(selectedMonth === null) { return allMonths; }
    var filtered = allMonths.filter(function(m){ return m.label === selectedMonth; });
    return filtered.length > 0 ? filtered : allMonths;
  }
  var weeks = WEEKS.slice(Math.max(0, WEEKS.length-visibleCount));
  return weeks.length > 0 ? weeks : WEEKS.slice(-1);
}

function getAvailableMonths(){
  var groups={}, order=[];
  WEEKS.forEach(function(w){
    if(!groups[w.month]){ groups[w.month]=0; order.push(w.month); }
    groups[w.month]++;
  });
  var seen={}, uniq=[];
  order.forEach(function(m){ if(!seen[m]){ seen[m]=1; uniq.push(m); } });
  return uniq.filter(function(m){ return groups[m]>=1; });
}

/* ════ مساعدات ════ */
function getVisibleWeeks() { return getVW(); }
function labels()  { return getVisibleWeeks().map(function(w){ return w.label; }); }
function vals(fn)  { return getVisibleWeeks().map(fn); }
function fmt(n)    { return String(n); }

/* ════ منتقي الأسابيع ════ */
function toggleWeekMenu(e) {
  e.stopPropagation();
  var dd=document.getElementById('weekDropdown'), btn=document.getElementById('weekBtn');
  var open=dd.classList.contains('open');
  dd.classList.toggle('open',!open); btn.classList.toggle('open',!open);
}
function wkLabel(n,total){ if(n===total) return 'كل الأسابيع ('+total+')'; if(n===1) return 'آخر أسبوع'; if(n===2) return 'آخر أسبوعين'; if(n>=3&&n<=10) return 'آخر '+n+' أسابيع'; return 'آخر '+n+' أسبوع'; }
function buildWeekDropdown(){
  var dd=document.getElementById('weekDropdown'); if(!dd) return;
  var h='';
  for(var wi=1; wi<=WEEKS.length; wi++){
    h += '<div class="wk-opt'+(wi===visibleCount?' sel':'')+'" data-n="'+wi+'" onclick="setWeeks('+wi+')">'+wkLabel(wi,WEEKS.length)+' <span class="wk-chk">✓</span></div>';
  }
  dd.innerHTML=h;
  var bl=document.getElementById('weekBtnLabel');
  if(bl) bl.textContent=wkLabel(visibleCount,WEEKS.length);
}
function setWeeks(n) {
  visibleCount = n;
  document.querySelectorAll('.wk-opt').forEach(function(o){ o.classList.toggle('sel', parseInt(o.getAttribute('data-n'))===n); });
  document.getElementById('weekBtnLabel').textContent = wkLabel(n,WEEKS.length);
  document.getElementById('weekDropdown').classList.remove('open');
  document.getElementById('weekBtn').classList.remove('open');
  init();
}
/* ════ منتقي الشهور + تبديل العرض ════ */
function buildMonthDropdown(){
  var months = getAvailableMonths();
  var dd = document.getElementById('monthDropdown');
  if(!dd) return;
  var isAll = (selectedMonth === null);
  var html = '<div class="mo-opt'+(isAll?' sel':'')+'" onclick="setSelectedMonth(null)">📊 كل الشهور <span class="mo-chk">✓</span></div>';
  html += months.map(function(m){
    return '<div class="mo-opt'+(selectedMonth===m?' sel':'')+'" onclick="setSelectedMonth(\''+m+'\')">'+m+' <span class="mo-chk">✓</span></div>';
  }).join('');
  dd.innerHTML = html;
}
function toggleMonthMenu(e){
  e.stopPropagation();
  buildMonthDropdown();
  var dd=document.getElementById('monthDropdown'), btn=document.getElementById('monthBtn');
  var open=dd.classList.contains('open');
  dd.classList.toggle('open',!open); btn.classList.toggle('open',!open);
}
function setSelectedMonth(m){
  selectedMonth = m;
  var lbl = document.getElementById('monthBtnLabel');
  if(lbl) lbl.textContent = (m===null) ? '📊 كل الشهور' : m;
  document.getElementById('monthDropdown').classList.remove('open');
  document.getElementById('monthBtn').classList.remove('open');
  init();
}
function setViewMode(mode){
  viewMode = mode;
  document.getElementById('vt-weekly').classList.toggle('active', mode==='weekly');
  document.getElementById('vt-monthly').classList.toggle('active', mode==='monthly');
  var ws=document.getElementById('weekSelector');
  var ms=document.getElementById('monthSelector');
  if(ws) ws.style.display = mode==='monthly' ? 'none' : '';
  if(ms) ms.style.display = mode==='monthly' ? '' : 'none';
  if(mode==='monthly'){
    var md = buildMonthlyData();
    selectedMonth = md.length > 0 ? md[md.length-1].label : null;
    var lbl=document.getElementById('monthBtnLabel');
    if(lbl) lbl.textContent = selectedMonth || '📊 كل الشهور';
  } else {
    selectedMonth = null;
  }
  init();
}
document.addEventListener('click', function(e) {
  var s=document.getElementById('weekSelector');
  if (s&&!s.contains(e.target)) {
    document.getElementById('weekDropdown').classList.remove('open');
    document.getElementById('weekBtn').classList.remove('open');
  }
  var ms=document.getElementById('monthSelector');
  if (ms&&!ms.contains(e.target)) {
    document.getElementById('monthDropdown').classList.remove('open');
    document.getElementById('monthBtn').classList.remove('open');
  }
});
document.getElementById('weekDropdown').addEventListener('wheel', function(e){
  var el=this;
  var atTop=el.scrollTop===0 && e.deltaY<0;
  var atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight && e.deltaY>0;
  if(!atTop && !atBottom) e.stopPropagation();
}, {passive:false});

/* ════ التنقل مع دعم الأقسام المطوية ════ */
function navTo(id, clickedEl) {
  /* إذا كان القسم مطوياً — افتحه أولاً */
  var hdr = document.getElementById(id);
  if (hdr && hdr.classList.contains('collapsed')) {
    hdr.classList.remove('collapsed');
    var body = hdr.nextElementSibling;
    if (body && body.classList.contains('sec-body')) body.classList.remove('collapsed');
  }
  setTimeout(function(){
    var el = document.getElementById(id);
    if (!el) return;
    var offset = el.getBoundingClientRect().top + window.pageYOffset;
    var topH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--top-h'))||54;
    var navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h'))||56;
    window.scrollTo({ top: offset - topH - navH - 6, behavior:'smooth' });
  }, 30);
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  if (clickedEl) clickedEl.classList.add('active');
}

/* ════ تمييز القسم تلقائياً بالتمرير (IntersectionObserver) ════ */
function initScrollObserver() {
  if (!window.IntersectionObserver) return;
  var ids = ['sec-quality','sec-emergency','sec-surgery','sec-clinics','sec-satisfaction',
             'sec-capacity','sec-pharmacy','sec-screening','sec-urgent','sec-home','sec-endo'];
  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var id = entry.target.id;
      document.querySelectorAll('.nav-item').forEach(function(ni) {
        var oc = ni.getAttribute('onclick') || '';
        var active = oc.indexOf("'"+id+"'") !== -1;
        ni.classList.toggle('active', active);
        if (active) ni.scrollIntoView({block:'nearest', inline:'center'});
      });
    });
  }, { rootMargin:'-20% 0px -65% 0px', threshold:0 });
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if (el) obs.observe(el);
  });
}

/* ════ طي / توسيع الأقسام ════ */
function toggleSection(hdr) {
  var collapsed = hdr.classList.toggle('collapsed');
  var body = hdr.nextElementSibling;
  if (body && body.classList.contains('sec-body')) {
    body.classList.toggle('collapsed', collapsed);
  }
}

/* ════ الألوان ════ */
function getColors() {
  var s = getComputedStyle(document.body);
  function v(n,fb){ return s.getPropertyValue(n).trim()||fb; }
  return { text:v('--txt','#ddeeff'), muted:v('--muted','#4a7da8'),
    red:v('--red','#ff5f6b'), amber:v('--amber','#f9c74f'), green:v('--green','#3dd68c'),
    teal:v('--teal','#2de0d4'), blue:v('--blue','#4db8ff'), purple:v('--purple','#b197fc') };
}

/* ════ بناء الجداول ════ */
function tblMinW() { return (120 + getVisibleWeeks().length * 82) + 'px'; }
function wkHdrs() {
  return getVisibleWeeks().slice().reverse().map(function(w,i){
    var cls = (i===0)?'w-last':'';
    return '<th class="'+cls+'">'+w.label+'<br><span style="font-size:9px;font-weight:400;opacity:.65">'+w.dateRange+'</span></th>';
  }).join('');
}
function row(lbl, fn, cls) {
  cls = cls||'';
  var cells = getVisibleWeeks().slice().reverse().map(function(w,i){
    var v=fn(w), wc=(i===0)?'w-last':'';
    return '<td class="'+cls+' '+wc+'">'+(typeof v==='number'?fmt(v):v)+'</td>';
  }).join('');
  return '<tr><td style="text-align:right">'+lbl+'</td>'+cells+'</tr>';
}
function rowRaw(lbl, fn, cls) {
  cls=cls||'';
  var cells=getVisibleWeeks().slice().reverse().map(function(w,i){
    return '<td class="'+cls+' '+((i===0)?'w-last':'')+'">'+fn(w)+'</td>';
  }).join('');
  return '<tr><td style="text-align:right">'+lbl+'</td>'+cells+'</tr>';
}

/* ════ KPI مع مؤشر الاتجاه ════ */
function kpi(label, val, cls, curr, prev) {
  var trend = '';
  if (curr !== undefined && prev !== undefined && typeof curr==='number' && typeof prev==='number') {
    var d = Math.round((curr - prev) * 10) / 10;
    if (d !== 0) {
      var sym = d > 0 ? '▲' : '▼';
      trend = '<span class="kpi-trend '+(d>0?'trend-up':'trend-dn')+'">'+sym+Math.abs(d)+'</span>';
    }
  }
  return '<div class="kpi">'
    +'<div class="kpi-label">'+label+'</div>'
    +'<div class="kpi-row"><span class="kpi-val '+(cls||'')+'">'+val+'</span>'+trend+'</div>'
    +'</div>';
}

/* ════ قسم قابل للطي ════ */
function section(id, emoji, title, content) {
  return '<div class="sec-hdr" id="'+id+'" onclick="toggleSection(this)">'
    +'<span class="sec-emoji">'+emoji+'</span> '+title
    +'<span class="sec-arrow">▾</span>'
    +'</div>'
    +'<div class="sec-body">'+content+'</div>';
}
function tbl(header, rows) {
  var tmw = 'min-width:'+tblMinW();
  return '<div class="tbl-wrap"><table style="'+tmw+'"><thead><tr><th>'+header+'</th>'+wkHdrs()+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ════════════════════════════════════════════
   محرك الرسوم البيانية SVG
════════════════════════════════════════════ */
function wrapWithZoom(id, svg) {
  var cont = document.getElementById(id); if (!cont) return;
  cont.innerHTML = '';
  var z = document.createElement('div'); z.className = 'chart-zoom';
  var w = document.createElement('div'); w.className = 'chart-wrap';
  w.appendChild(svg); z.appendChild(w); cont.appendChild(z);
  z.addEventListener('mousedown', function(){ z.style.cursor='grabbing'; });
  window.addEventListener('mouseup', function(){ z.style.cursor='grab'; });
}

function drawGridLines(svg, ns, cTop, cBot, cLeft, cRight, maxV, steps, col) {
  for (var s=0; s<=steps; s++) {
    var y = cBot - (s/steps)*(cBot-cTop);
    var line = document.createElementNS(ns,'line');
    line.setAttribute('x1',cLeft); line.setAttribute('y1',y);
    line.setAttribute('x2',cRight); line.setAttribute('y2',y);
    line.setAttribute('stroke', s===0
      ? (isLight?'rgba(80,120,160,.35)':'rgba(255,255,255,.14)')
      : (isLight?'rgba(80,120,160,.1)':'rgba(255,255,255,.05)'));
    line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    var t = document.createElementNS(ns,'text');
    t.setAttribute('x',cLeft-4); t.setAttribute('y',y+3.5);
    t.setAttribute('text-anchor','end'); t.setAttribute('font-size','8');
    t.setAttribute('fill',col.muted); t.setAttribute('opacity','.72');
    var lv = Math.round((s/steps)*maxV);
    t.textContent = lv>999?(lv/1000).toFixed(1)+'k':lv;
    svg.appendChild(t);
  }
}

function addLegend(svg, ns, datasets, W, y, col) {
  var sqSz = 8;       // حجم المربع
  var sqGap = -10;     // المسافة بين المربع والنص (زادت من 5 إلى 10)
  var itemGap = 30;   // المسافة بين كل عنصر وآخر
  var charW = 5.1;
  var padding = 10;   // هامش أيمن
  
  var items = datasets.map(function(ds) {
    return {
      label: ds.label,
      color: ds.color,
      width: sqSz + sqGap + ds.label.length * charW
    };
  });
  
  // محاذاة إلى اليمين (لأن RTL)
  var x = W - padding ;
  var cy = y + 8;
  var verticalOffset = -1; // إزاحة رأسية بسيطة (عدّل حسب رغبتك)
  
  items.slice().reverse().forEach(function(item) {
    x -= item.width;
    
    var sq = document.createElementNS(ns, 'rect');
    sq.setAttribute('x', x);
    sq.setAttribute('y', cy - sqSz / 2 + verticalOffset);  // مع الإزاحة
    sq.setAttribute('width', sqSz);
    sq.setAttribute('height', sqSz);
    sq.setAttribute('fill', item.color);
    sq.setAttribute('rx', '2');
    svg.appendChild(sq);
    
    var txt = document.createElementNS(ns, 'text');
    txt.setAttribute('x', x + sqSz + sqGap);
    txt.setAttribute('y', cy + 3.5);
    txt.setAttribute('text-anchor', 'start');
    txt.setAttribute('font-size', '9');
    txt.setAttribute('fill', col.muted);
    txt.setAttribute('opacity', '0.85');
    txt.textContent = item.label;
    svg.appendChild(txt);
    
    x -= itemGap;
  });
}

function drawSVGBarChart(id, lbls, datasets) {
  var cont = document.getElementById(id); if (!cont) return;
  var n = lbls.length;
  var minW = Math.max(380, n*82+80);
  var W = Math.max(minW, cont.offsetWidth||minW);
  var H = 380, ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var col = getColors();
  var legH=26, ML=38, MR=10, MT=12, MB=24;
  var cTop=MT, cBot=H-legH-MB, cLeft=ML, cRight=W-MR;
  var cW=cRight-cLeft, cH=cBot-cTop;
  var allVals = datasets.reduce(function(a,d){return a.concat(d.data);},[]); 
  var maxV = Math.max.apply(null,allVals.map(function(v){return isNaN(+v)?0:+v;}))*1.15||1;
  drawGridLines(svg,ns,cTop,cBot,cLeft,cRight,maxV,4,col);
  var nS=datasets.length, gap=2;
  var groupW=cW/n;
  var barW=Math.max(6,((groupW*0.64)-gap*(nS-1))/nS);
  var totalBarW=barW*nS+gap*(nS-1);
  datasets.forEach(function(ds,idx){
    ds.data.forEach(function(val,i){
      var numV = isNaN(+val)?0:+val;
      var bh=(numV/maxV)*cH, gx=cLeft+i*groupW+groupW/2;
      var bx=gx-totalBarW/2+idx*(barW+gap), by=cBot-bh;
      var r=Math.min(3,barW/2,bh);
      var p=document.createElementNS(ns,'path');
      if (bh<1) { p.setAttribute('d','M'+bx+','+cBot+' h'+barW); }
      else {
        p.setAttribute('d','M'+(bx+r)+','+by+' Q'+bx+','+by+' '+bx+','+(by+r)+' V'+cBot+' H'+(bx+barW)+' V'+(by+r)+' Q'+(bx+barW)+','+by+' '+(bx+barW-r)+','+by+' Z');
      }
      p.setAttribute('fill',ds.color); p.setAttribute('opacity','.88');
      svg.appendChild(p);
      if (numV>0&&bh>0) {
        var t=document.createElementNS(ns,'text');
        t.setAttribute('x',bx+barW/2); t.setAttribute('y',by-3);
        t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','7.5');
        t.setAttribute('font-weight','600'); t.setAttribute('fill',col.text);
        t.setAttribute('opacity','.82');
        t.textContent=numV>=1000?(numV/1000).toFixed(1)+'k':String(numV);
        svg.appendChild(t);
      }
    });
  });
  for (var i=0;i<n;i++){
    var t=document.createElementNS(ns,'text');
    t.setAttribute('x',cLeft+i*groupW+groupW/2); t.setAttribute('y',cBot+14);
    t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','9');
    t.setAttribute('fill',col.muted); t.textContent=lbls[i];
    svg.appendChild(t);
  }
  addLegend(svg,ns,datasets,W,H-legH+2,col);
  wrapWithZoom(id,svg);
}

function drawSVGCombinedChart(id, lbls, barData, lineData) {
  var cont=document.getElementById(id); if (!cont) return;
  var n=lbls.length, minW=Math.max(380,n*82+80);
  var W=Math.max(minW,cont.offsetWidth||minW), H=380, ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var col=getColors(), legH=26, ML=38, MR=10, MT=12, MB=24;
  var cTop=MT,cBot=H-legH-MB,cLeft=ML,cRight=W-MR,cW=cRight-cLeft,cH=cBot-cTop;
  var maxB=(Math.max.apply(null,barData.data)||0)*1.18||1;
  var maxL=(Math.max.apply(null,lineData.data)||0)*1.25||1;
  var groupW=cW/n, barW=groupW*0.58;
  drawGridLines(svg,ns,cTop,cBot,cLeft,cRight,maxB,4,col);
  barData.data.forEach(function(val,i){
    var bh=(val/maxB)*cH, bx=cLeft+i*groupW+(groupW-barW)/2, by=cBot-bh, r=Math.min(3,barW/2,bh);
    var p=document.createElementNS(ns,'path');
    if (bh<1){p.setAttribute('d','M'+bx+','+cBot+' h'+barW);}
    else{p.setAttribute('d','M'+(bx+r)+','+by+' Q'+bx+','+by+' '+bx+','+(by+r)+' V'+cBot+' H'+(bx+barW)+' V'+(by+r)+' Q'+(bx+barW)+','+by+' '+(bx+barW-r)+','+by+' Z');}
    p.setAttribute('fill',barData.color); p.setAttribute('opacity','.82');
    svg.appendChild(p);
    if (val>0&&bh>12){var t=document.createElementNS(ns,'text');t.setAttribute('x',bx+barW/2);t.setAttribute('y',by-3);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','7.5');t.setAttribute('font-weight','600');t.setAttribute('fill',col.text);t.setAttribute('opacity','.82');t.textContent=String(val);svg.appendChild(t);}
  });
  var pts=lineData.data.map(function(v,i){return {x:cLeft+i*groupW+groupW/2, y:cBot-(v/maxL)*cH, v:v};});
  var af=document.createElementNS(ns,'path');
  var ap='M'+pts[0].x+','+cBot;
  pts.forEach(function(p){ap+=' L'+p.x+','+p.y;});
  ap+=' L'+pts[pts.length-1].x+','+cBot+' Z';
  af.setAttribute('d',ap); af.setAttribute('fill',lineData.color); af.setAttribute('opacity','.07');
  svg.appendChild(af);
  var pl=document.createElementNS(ns,'polyline');
  pl.setAttribute('points',pts.map(function(p){return p.x+','+p.y;}).join(' '));
  pl.setAttribute('stroke',lineData.color); pl.setAttribute('stroke-width','2.2');
  pl.setAttribute('fill','none'); pl.setAttribute('stroke-linejoin','round');
  svg.appendChild(pl);
  pts.forEach(function(p){
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r','4');
    c.setAttribute('fill',lineData.color);
    c.setAttribute('stroke',isLight?'#fff':'#07101c'); c.setAttribute('stroke-width','1.8');
    svg.appendChild(c);
    var ts=Math.round(p.v)+'%', tw=ts.length*5.5+8;
    var bg=document.createElementNS(ns,'rect');
    bg.setAttribute('x',p.x-tw/2); bg.setAttribute('y',p.y-18);
    bg.setAttribute('width',tw); bg.setAttribute('height',13); bg.setAttribute('rx','4');
    bg.setAttribute('fill',isLight?'rgba(224,236,245,.92)':'rgba(7,16,28,.88)');
    svg.appendChild(bg);
    var lt=document.createElementNS(ns,'text');
    lt.setAttribute('x',p.x); lt.setAttribute('y',p.y-8);
    lt.setAttribute('text-anchor','middle'); lt.setAttribute('font-size','9');
    lt.setAttribute('font-weight','700'); lt.setAttribute('fill',lineData.color);
    lt.textContent=ts; svg.appendChild(lt);
  });
  for(var i=0;i<n;i++){var t=document.createElementNS(ns,'text');t.setAttribute('x',cLeft+i*groupW+groupW/2);t.setAttribute('y',cBot+14);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','9');t.setAttribute('fill',col.muted);t.textContent=lbls[i];svg.appendChild(t);}
  addLegend(svg,ns,[barData,lineData],W,H-legH+2,col);
  wrapWithZoom(id,svg);
}

function drawSVGCombinedChartDualAxis(id, lbls, barDatasets, lineDataset) {
  var cont = document.getElementById(id); if (!cont) return;
  var n = lbls.length;
  var minW = Math.max(380, n * 82 + 80);
  var W = Math.max(minW, cont.offsetWidth || minW);
  var H = 380;
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  
  var col = getColors();
  var legH = 26;
  var ML = 48;  // زيادة الهامش الأيسر للمحور الأيمن
  var MR = 48;  // هامش أيمن للمحور الأيمن
  var MT = 12;
  var MB = 24;
  var cTop = MT;
  var cBot = H - legH - MB;
  var cLeft = ML;
  var cRight = W - MR;
  var cW = cRight - cLeft;
  var cH = cBot - cTop;
  
  // حساب القيم القصوى للمحور الأيسر (الأعمدة)
  var allBarVals = [];
  barDatasets.forEach(function(ds) {
    allBarVals = allBarVals.concat(ds.data);
  });
  var maxBar = Math.max.apply(null, allBarVals.map(function(v) { return isNaN(+v) ? 0 : +v; })) * 1.15 || 1;
  
  // حساب القيم القصوى للمحور الأيمن (الخط - نسب مئوية)
  var maxLine = Math.max.apply(null, lineDataset.data.map(function(v) { return isNaN(+v) ? 0 : +v; })) * 1.15 || 100;
  var minLine = Math.min.apply(null, lineDataset.data.map(function(v) { return isNaN(+v) ? 0 : +v; })) || 0;
  
  // رسم شبكة المحور الأيسر
  for (var s = 0; s <= 4; s++) {
    var y = cBot - (s / 4) * cH;
    var line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', cLeft);
    line.setAttribute('y1', y);
    line.setAttribute('x2', cRight);
    line.setAttribute('y2', y);
    line.setAttribute('stroke', s === 0
      ? (isLight ? 'rgba(80,120,160,.35)' : 'rgba(255,255,255,.14)')
      : (isLight ? 'rgba(80,120,160,.1)' : 'rgba(255,255,255,.05)'));
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
    
    var t = document.createElementNS(ns, 'text');
    t.setAttribute('x', cLeft - 4);
    t.setAttribute('y', y + 3.5);
    t.setAttribute('text-anchor', 'end');
    t.setAttribute('font-size', '8');
    t.setAttribute('fill', col.muted);
    t.setAttribute('opacity', '.72');
    var lv = Math.round((s / 4) * maxBar);
    t.textContent = lv > 999 ? (lv / 1000).toFixed(1) + 'k' : lv;
    svg.appendChild(t);
  }
  
  // رسم شبكة المحور الأيمن (النسب المئوية)
  for (var s = 0; s <= 4; s++) {
    var y = cBot - (s / 4) * cH;
    var val = minLine + (s / 4) * (maxLine - minLine);
    var t = document.createElementNS(ns, 'text');
    t.setAttribute('x', cRight + 4);
    t.setAttribute('y', y + 3.5);
    t.setAttribute('text-anchor', 'start');
    t.setAttribute('font-size', '8');
    t.setAttribute('fill', lineDataset.color);
    t.setAttribute('opacity', '.82');
    t.textContent = Math.round(val) + '%';
    svg.appendChild(t);
  }
  
  // رسم الأعمدة (بار)
  var nS = barDatasets.length;
  var gap = 2;
  var groupW = cW / n;
  var barW = Math.max(4, ((groupW * 0.7) - gap * (nS - 1)) / nS);
  var totalBarW = barW * nS + gap * (nS - 1);
  
  barDatasets.forEach(function(ds, idx) {
    ds.data.forEach(function(val, i) {
      var numV = isNaN(+val) ? 0 : +val;
      var bh = (numV / maxBar) * cH;
      var gx = cLeft + i * groupW + groupW / 2;
      var bx = gx - totalBarW / 2 + idx * (barW + gap);
      var by = cBot - bh;
      var r = Math.min(3, barW / 2, bh);
      var p = document.createElementNS(ns, 'path');
      if (bh < 1) {
        p.setAttribute('d', 'M' + bx + ',' + cBot + ' h' + barW);
      } else {
        p.setAttribute('d', 'M' + (bx + r) + ',' + by + ' Q' + bx + ',' + by + ' ' + bx + ',' + (by + r) + ' V' + cBot + ' H' + (bx + barW) + ' V' + (by + r) + ' Q' + (bx + barW) + ',' + by + ' ' + (bx + barW - r) + ',' + by + ' Z');
      }
      p.setAttribute('fill', ds.color);
      p.setAttribute('opacity', '.88');
      svg.appendChild(p);
      
      if (numV > 0 && bh > 12) {
        var t = document.createElementNS(ns, 'text');
        t.setAttribute('x', bx + barW / 2);
        t.setAttribute('y', by - 3);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '7.5');
        t.setAttribute('font-weight', '600');
        t.setAttribute('fill', col.text);
        t.setAttribute('opacity', '.82');
        t.textContent = numV >= 1000 ? (numV / 1000).toFixed(1) + 'k' : String(numV);
        svg.appendChild(t);
      }
    });
  });
  
  // رسم الخط (نسبة الإشغال)
  var pts = lineDataset.data.map(function(v, i) {
    var numV = isNaN(+v) ? 0 : +v;
    var y = cBot - ((numV - minLine) / (maxLine - minLine)) * cH;
    return { x: cLeft + i * groupW + groupW / 2, y: y, v: numV };
  });
  
  // مساحة تحت الخط
  var af = document.createElementNS(ns, 'path');
  var ap = 'M' + pts[0].x + ',' + cBot;
  pts.forEach(function(p) { ap += ' L' + p.x + ',' + p.y; });
  ap += ' L' + pts[pts.length - 1].x + ',' + cBot + ' Z';
  af.setAttribute('d', ap);
  af.setAttribute('fill', lineDataset.color);
  af.setAttribute('opacity', '.07');
  svg.appendChild(af);
  
  // خط البيانات
  var pl = document.createElementNS(ns, 'polyline');
  pl.setAttribute('points', pts.map(function(p) { return p.x + ',' + p.y; }).join(' '));
  pl.setAttribute('stroke', lineDataset.color);
  pl.setAttribute('stroke-width', '2.5');
  pl.setAttribute('fill', 'none');
  pl.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(pl);
  
  // النقاط والقيم
  pts.forEach(function(p) {
    var c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', '4.5');
    c.setAttribute('fill', lineDataset.color);
    c.setAttribute('stroke', isLight ? '#fff' : '#07101c');
    c.setAttribute('stroke-width', '2');
    svg.appendChild(c);
    
    var ts = Math.round(p.v) + '%';
    var tw = ts.length * 5.5 + 10;
    var bg = document.createElementNS(ns, 'rect');
    bg.setAttribute('x', p.x - tw / 2);
    bg.setAttribute('y', p.y - 20);
    bg.setAttribute('width', tw);
    bg.setAttribute('height', 14);
    bg.setAttribute('rx', '4');
    bg.setAttribute('fill', isLight ? 'rgba(224,236,245,.94)' : 'rgba(7,16,28,.9)');
    svg.appendChild(bg);
    
    var lt = document.createElementNS(ns, 'text');
    lt.setAttribute('x', p.x);
    lt.setAttribute('y', p.y - 9);
    lt.setAttribute('text-anchor', 'middle');
    lt.setAttribute('font-size', '9');
    lt.setAttribute('font-weight', '700');
    lt.setAttribute('fill', lineDataset.color);
    lt.textContent = ts;
    svg.appendChild(lt);
  });
  
  // تسميات المحور السيني
  for (var i = 0; i < n; i++) {
    var t = document.createElementNS(ns, 'text');
    t.setAttribute('x', cLeft + i * groupW + groupW / 2);
    t.setAttribute('y', cBot + 14);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '9');
    t.setAttribute('fill', col.muted);
    t.textContent = lbls[i];
    svg.appendChild(t);
  }
  
  // إضافة الـ Legend (دمج جميع المجموعات)
  var allDatasets = barDatasets.concat([lineDataset]);
  addLegend(svg, ns, allDatasets, W, H - legH + 2, col);
  wrapWithZoom(id, svg);
}

    var main = document.getElementById('main-content');
    main.innerHTML = buildFullHTML();

    var sub = document.getElementById('topbar-sub');
    if(viewMode === 'monthly'){
      sub.textContent = '\u0627\u0644\u0639\u0631\u0636 \u0627\u0644\u0634\u0647\u0631\u064a \u2014 ' + vw.map(function(w){ return w.label; }).join(' \u2192 ');
    } else {
      sub.textContent = '\u0639\u0631\u0636: '+vw.length+' \u0623\u0633\u0627\u0628\u064a\u0639 ('+vw[0].label+' \u2192 '+vw[vw.length-1].label+')';
    }

    var wLbl = document.getElementById('weekBtnLabel');
    if(wLbl) wLbl.textContent = wkLabel(visibleCount, WEEKS.length);
    var mLbl = document.getElementById('monthBtnLabel');
    if(mLbl) mLbl.textContent = viewMode==='monthly' ? (selectedMonth || '\uD83D\uDCCA \u0643\u0644 \u0627\u0644\u0634\u0647\u0648\u0631') : '\uD83D\uDCCA \u0643\u0644 \u0627\u0644\u0634\u0647\u0648\u0631';
    document.getElementById('vt-weekly').classList.toggle('active', viewMode==='weekly');
    document.getElementById('vt-monthly').classList.toggle('active', viewMode==='monthly');
    var ws = document.getElementById('weekSelector');
    var ms = document.getElementById('monthSelector');
    if(ws) ws.style.display = viewMode==='monthly' ? 'none' : '';
    if(ms) ms.style.display = viewMode==='monthly' ? '' : 'none';
    document.querySelectorAll('.wk-opt').forEach(function(o){ o.classList.toggle('sel', parseInt(o.getAttribute('data-n'))===visibleCount); });

    /* setTimeout: يمنح iOS وقتاً لرسم DOM قبل استعلام clientWidth */
    setTimeout(function(){
      try { buildCharts(); } catch(ce){ /* الرسوم اختيارية */ }
      initScrollObserver();
    }, 200);
  } catch(e) {
    var fb = document.getElementById('main-content');
    if (fb) fb.innerHTML = '<div style="padding:20px;color:#ff5f6b;font-family:monospace;direction:ltr;font-size:12px">Error: '+String(e)+'</div>';
  }
}

function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  document.getElementById('themeBtn').textContent = isLight ? '\uD83C\uDF19 \u062f\u0627\u0643\u0646' : '\u2600\uFE0F \u0641\u0627\u062a\u062d';
  init();
}

buildWeekDropdown();
init();
</script>
</body>
</html>
