<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>لوحة الأداء — المستشفى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050e1a;--bg2:#081420;--card:#0c1e30;--card2:#0f2438;
  --border:rgba(20,55,90,0.6);--border2:rgba(35,80,130,0.7);--border-hi:rgba(77,184,255,0.12);
  --txt:#ddeeff;--txt-dim:#7aabcc;--muted:#3d6e90;
  --red:#ff5f6b;--amber:#f9c74f;--green:#3dd68c;--teal:#2de0d4;--blue:#4db8ff;--purple:#b197fc;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --top-h:60px;
  --glass-bg:rgba(5,14,26,.82);
  --glass-border:rgba(77,184,255,.08);
}
body.light{
  --bg:#f0f5fb;--bg2:#e4eef7;--card:#ffffff;--card2:#f7fafd;
  --border:rgba(160,195,230,0.7);--border2:rgba(110,160,210,0.75);--border-hi:rgba(77,184,255,0.2);
  --txt:#0a1825;--txt-dim:#1e3d58;--muted:#2f5a7a;
  --glass-bg:rgba(240,245,251,.88);
  --glass-border:rgba(77,184,255,.12);
}
body.light{
  --bg:#f0f5fb;--bg2:#e4eef7;--card:#ffffff;--card2:#f7fafd;
  --border:rgba(160,195,230,0.7);--border2:rgba(110,160,210,0.75);--border-hi:rgba(77,184,255,0.2);
  --txt:#0a1825;--txt-dim:#1e3d58;--muted:#2f5a7a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-y:auto!important;height:auto;min-height:100vh;}
body{font-family:var(--font);background:var(--bg);color:var(--txt);direction:rtl;transition:background .3s,color .3s;padding-top:var(--top-h);padding-bottom:0;-webkit-overflow-scrolling:touch;}

/* ─── Subtle BG noise ─── */
body::before{content:'';position:fixed;inset:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;pointer-events:none;z-index:0;}
body.light::before{opacity:.018;}
html::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}
.chart-scroll::-webkit-scrollbar{width:0;height:3px}.chart-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.chart-scroll{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.tbl-wrap::-webkit-scrollbar{height:3px}.tbl-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.tbl-wrap{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}

.topbar{position:fixed;top:0;left:0;right:0;z-index:1001;height:var(--top-h);background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid var(--glass-border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
body.light .topbar{background:var(--glass-bg);}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.35;}
.topbar-info{min-width:0;flex:1;overflow:hidden;}
.topbar-title{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;}
.topbar-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 10px var(--green);animation:pulseDot 2s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 10px var(--green);}50%{opacity:.4;box-shadow:0 0 4px var(--green);}}
.update-badge{font-size:8.5px;padding:2px 7px;border-radius:5px;background:rgba(61,214,140,.1);color:var(--green);border:1px solid rgba(61,214,140,.2);white-space:nowrap;display:flex;align-items:center;gap:4px;}
.topbar-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.topbar-actions{display:flex;gap:7px;align-items:center;flex-shrink:0;}
.icon-btn{background:var(--card);border:1px solid var(--border2);color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s;flex-shrink:0;}
.icon-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(77,184,255,.08);transform:translateY(-1px);}
.icon-btn:active{transform:scale(.93);}

.content{padding:14px 14px 30px;width:100%;max-width:1600px;margin:0 auto;}

.quick-overview{background:var(--card);border:1px solid var(--border-hi);border-radius:14px;padding:14px 16px 16px;margin-bottom:14px;}
.quick-overview-hdr{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;}
.quick-overview-hdr span{font-size:10px;font-weight:400;opacity:.6;}
.quick-overview-hdr .controls-row{background:none;border:none;margin:0;padding:0;border-radius:0;}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.quick-card{background:var(--card2);border:1px solid var(--border-hi);border-radius:10px;padding:10px 12px 8px;display:flex;flex-direction:column;align-items:center;position:relative;transition:border-color .2s,box-shadow .2s;}
.quick-card:hover{border-color:var(--border2);box-shadow:0 2px 12px rgba(0,0,0,.2);}
.quick-zoom-hint{position:absolute;top:6px;right:6px;font-size:10px;opacity:0;transition:opacity .2s;z-index:2;}
.quick-zoom-trigger:hover .quick-zoom-hint{opacity:.6;}
.quick-card-title{font-size:9px;font-weight:700;color:var(--txt-dim);opacity:.7;margin-bottom:4px;text-align:center;}
.quick-card-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;width:100%;}
.quick-dtl{display:flex;gap:5px;margin-top:3px;justify-content:center;flex-wrap:wrap;}
.quick-dtl .detail-btn{font-size:9px;padding:2px 6px;border-radius:5px;}
.quick-card-content svg{flex-shrink:0;max-width:100%;}
.quick-card-content svg text:not([fill]){fill:var(--txt);}
.donut-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 8px;width:100%;margin-top:2px;}
.donut-leg-item{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--txt-dim);white-space:nowrap;}
.donut-leg-sq{width:6px;height:6px;border-radius:2px;flex-shrink:0;}
.donut-leg-val{font-weight:700;color:var(--txt);font-size:8px;}
.donut-leg-pct{color:var(--muted);font-size:7px;}

.stacked-bar-wrap{width:100%;display:flex;flex-direction:column;gap:2px;padding:2px 0;}
.stacked-bar-row{display:flex;align-items:center;gap:6px;}
.stacked-bar-lbl{font-size:9px;font-weight:600;color:var(--txt-dim);min-width:40px;}
.stacked-bar-track{flex:1;height:20px;border-radius:4px;overflow:hidden;background:var(--border);display:flex;}
.stacked-bar-seg{height:100%;transition:width .4s ease;}
.stacked-bar-val{font-size:9px;font-weight:700;color:var(--txt);min-width:50px;text-align:left;}

.controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;background:var(--card);border:1px solid var(--border-hi);border-radius:10px;}
.controls-row .month-selector{position:relative;}
.controls-row .week-selector{position:relative;}
.week-selector{position:relative;}
.week-btn{display:flex;align-items:center;gap:5px;background:rgba(77,184,255,.08);border:1px solid rgba(77,184,255,.28);color:var(--blue);padding:6px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;white-space:nowrap;}
.week-btn:hover{background:rgba(77,184,255,.14);}
.caret{font-size:8px;opacity:.6;transition:transform .2s;}.week-btn.open .caret{transform:rotate(180deg);}
.week-dropdown{position:absolute;top:calc(100% + 7px);left:0;min-width:180px;background:var(--card2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;z-index:2000;box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .16s,transform .16s;}
.week-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.wk-opt{padding:10px 15px;font-size:12px;cursor:pointer;color:var(--txt-dim);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);transition:background .13s;}
.wk-opt:last-child{border-bottom:none;}.wk-opt:hover{background:rgba(77,184,255,.07);color:var(--txt);}
.wk-opt.sel{color:var(--blue);background:rgba(77,184,255,.09);font-weight:600;}
.wk-opt .wk-chk{opacity:0;transition:opacity .13s;font-size:10px;}.wk-opt.sel .wk-chk{opacity:1;}

.month-selector{position:relative;}
.month-btn{display:flex;align-items:center;gap:5px;background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.3);color:var(--green);padding:6px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;white-space:nowrap;}
.month-btn:hover{background:rgba(61,214,140,.14);}
.month-btn .caret2{font-size:8px;opacity:.6;transition:transform .2s;}.month-btn.open .caret2{transform:rotate(180deg);}
.month-dropdown{position:absolute;top:calc(100% + 7px);left:0;min-width:155px;background:var(--card2);border:1px solid var(--border2);border-radius:10px;overflow:hidden;z-index:2000;box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .16s,transform .16s;}
.month-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.mo-opt{padding:9px 14px;font-size:12px;cursor:pointer;color:var(--txt-dim);display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);transition:background .13s;}
.mo-opt:last-child{border-bottom:none;}.mo-opt:hover{background:rgba(61,214,140,.07);color:var(--txt);}
.mo-opt.sel{color:var(--green);background:rgba(61,214,140,.09);font-weight:600;}
.mo-opt .mo-chk{opacity:0;font-size:10px;}.mo-opt.sel .mo-chk{opacity:1;}

.view-toggle{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border2);border-radius:8px;overflow:hidden;flex-shrink:0;}
.vt-btn{padding:5px 11px;font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);background:transparent;border:none;font-family:var(--font);transition:all .18s;white-space:nowrap;}
.vt-btn.active{background:var(--blue);color:#050e1a;}
body.light .vt-btn.active{color:#fff;}
.vt-divider{width:1px;background:var(--border2);align-self:stretch;}

.panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:0;}
.panel-grid .panel-wide{grid-column:span 2;}
.panel-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:0;}
.panel-grid-1{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:0;}

.panel{background:var(--card);border:1px solid var(--border-hi);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .2s;scroll-margin-top:calc(var(--top-h) + 8px);position:relative;}
.panel:hover{box-shadow:0 8px 32px rgba(0,0,0,.3);}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.25;}
.panel-hdr{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.panel-hdr:hover{background:rgba(77,184,255,.03);}
.panel-emoji{font-size:15px;flex-shrink:0;}
.panel-title{flex:1;font-size:12px;font-weight:700;color:var(--txt-dim);letter-spacing:.4px;}
.panel-arrow{font-size:10px;color:var(--muted);opacity:.5;transition:transform .25s;flex-shrink:0;}
.panel-hdr.collapsed .panel-arrow{transform:rotate(-90deg);}
.panel-body{flex:1;padding:12px 14px 10px;overflow:hidden;transition:max-height .35s ease,opacity .28s ease,padding .3s ease;}
.panel-body.collapsed{max-height:0!important;opacity:0;padding-top:0;padding-bottom:0;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:10px;}
.kpi{background:var(--card2);border:1px solid var(--border-hi);border-radius:9px;padding:11px 12px 9px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;}
.kpi::before{content:'';position:absolute;top:0;right:0;left:0;height:2px;border-radius:9px 9px 0 0;background:var(--kpi-accent,transparent);}
.kpi::after{content:'';position:absolute;inset:0;border-radius:9px;background:linear-gradient(135deg,transparent 60%,rgba(77,184,255,.02));pointer-events:none;}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.28);}
.kpi-label{color:var(--txt-dim);font-size:9.5px;font-weight:500;opacity:.8;line-height:1.4;}
.kpi-row{display:flex;align-items:baseline;gap:6px;margin-top:5px;}
.kpi-val{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.5px;}
.kpi-trend{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;}
.trend-up{color:var(--green);background:rgba(61,214,140,.12);}
.trend-dn{color:var(--red);background:rgba(255,95,107,.12);}
.trend-flat{color:var(--muted);background:rgba(77,184,255,.06);}

/* ─── Outlier highlight animation ─── */
@keyframes outlierShimmer{0%,100%{opacity:1;}50%{opacity:.7;}}
.kpi.outlier::before{background:linear-gradient(90deg,var(--kpi-accent,var(--amber)),transparent 80%)!important;animation:outlierShimmer 2s ease-in-out infinite;}
.kpi-stat-outlier{position:relative;}
.kpi-stat-outlier::after{content:'⚠';position:absolute;top:-2px;right:-2px;font-size:7px;}
.v-r{color:var(--red);}.v-g{color:var(--green);}.v-a{color:var(--amber);}.v-t{color:var(--teal);}.v-b{color:var(--blue);}.v-p{color:var(--purple);}
.kpi:has(.v-r){--kpi-accent:var(--red);}.kpi:has(.v-g){--kpi-accent:var(--green);}.kpi:has(.v-b){--kpi-accent:var(--blue);}.kpi:has(.v-t){--kpi-accent:var(--teal);}.kpi:has(.v-a){--kpi-accent:var(--amber);}.kpi:has(.v-p){--kpi-accent:var(--purple);}
.kpi-spark{margin-top:6px;height:28px;width:100%;}
.kpi-spark svg{display:block;width:100%;height:28px;}

/* ── Extra chart panels ── */
.extra-charts-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
.xchart{background:var(--card);border:1px solid var(--border-hi);border-radius:12px;padding:13px 14px 11px;display:flex;flex-direction:column;align-items:center;}
.xchart-title{font-size:10px;font-weight:700;color:var(--txt-dim);margin-bottom:8px;align-self:flex-start;}
.xchart svg{display:block;max-width:100%;}
.xchart-legend{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:8px;}
.xcl-item{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--txt-dim);line-height:1.6;}
.xcl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.xcl-lbl{flex:none;white-space:nowrap;}
.xcl-leader{flex:1;border-bottom:1px dotted rgba(77,184,255,.28);margin:0 3px;min-width:10px;align-self:flex-end;margin-bottom:4px;}
.xcl-val{font-weight:700;color:var(--txt);white-space:nowrap;flex:none;}

.hbar-wrap{width:100%;display:flex;flex-direction:column;gap:6px;padding:2px 0;}
.hbar-row{width:100%;}
.hbar-track{width:100%;border-radius:6px;overflow:hidden;background:var(--border);height:26px;}
.hbar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;min-width:40px;transition:width .4s ease;}
.hbar-lbl{font-size:9px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-val{font-size:9px;font-weight:800;color:#fff;white-space:nowrap;flex-shrink:0;margin-right:2px;}
body.light .hbar-lbl,body.light .hbar-val{color:var(--txt);}

.sat-line-lbl{font-size:7px !important;}

.detail-toggles{display:flex;gap:6px;flex-wrap:wrap;}
.detail-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border2);color:var(--muted);padding:5px 11px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;}
.detail-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(77,184,255,.06);}
.detail-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(77,184,255,.1);}

.detail-panel-row{
  grid-column:1/-1;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .38s ease,opacity .28s ease;
  background:var(--card);border:1px solid var(--border-hi);border-radius:12px;
  margin-bottom:0;
}
.detail-panel-row.open{max-height:none;opacity:1;margin-bottom:12px;}
.detail-inner{padding:14px 16px;}
.chart-title-sm{font-size:11px;font-weight:600;margin-bottom:12px;color:var(--txt-dim);display:flex;align-items:center;gap:6px;}

.inline-panel{
  display:none;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .38s ease,opacity .28s ease;
  border-top:1px solid var(--border);
  margin-top:10px;
}
.inline-panel.open{display:block;max-height:none;opacity:1;}
.inline-inner{padding:12px 14px;}

@media(max-width:700px){
  .panel-grid,.panel-grid-2{display:flex;flex-direction:column;gap:12px;}
  .panel-grid .panel-wide{grid-column:unset;}
  .detail-panel-row{display:none!important;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-val{font-size:18px;}
  .content{padding:10px 10px 80px;}
  :root{--top-h:56px;}
  .quick-grid{grid-template-columns:repeat(2,1fr);}
  .controls-row{flex-direction:column;align-items:stretch;}

}

@media(max-width:400px){
  .quick-grid{grid-template-columns:1fr 1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-val{font-size:16px;}
  .kpi{padding:8px 10px 7px;}
  .topbar-title{font-size:11px;}
  .update-badge{font-size:7px;padding:1px 5px;}
}

.chart-scroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;cursor:grab;width:100%;border-radius:6px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
.chart-scroll::-webkit-scrollbar{height:3px;}.chart-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.chart-scroll:active{cursor:grabbing;}

.tbl-wrap{overflow-x:auto;border-radius:9px;border:1px solid var(--border);background:var(--card);-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:11.5px;}
th{background:var(--bg2);color:var(--muted);font-weight:600;padding:8px 7px;border-bottom:1px solid var(--border2);text-align:center;font-size:10px;white-space:nowrap;}
td{padding:7px 7px;border-bottom:1px solid var(--border);text-align:center;transition:background .12s;}
tr:last-child td{border-bottom:none;}tbody tr:hover td{background:rgba(77,184,255,.04);}
td:first-child,th:first-child{text-align:right;position:sticky;right:0;background:var(--card);font-weight:600;width:115px;min-width:95px;box-shadow:-2px 0 10px -2px rgba(0,0,0,.35);border-left:1px solid var(--border2);}
th:first-child{background:var(--bg2);z-index:4;}td:first-child{z-index:2;}
body.light td:first-child{background:#fff;}body.light th:first-child{background:var(--bg2);}
.w-last{font-weight:700;color:var(--blue);}

/* ─── Outlier cell highlight in tables ─── */
td.outlier-cell{position:relative;}
td.outlier-cell::after{content:'';position:absolute;inset:2px;border-radius:3px;border:1.5px solid var(--amber);opacity:.4;pointer-events:none;animation:outPulse 1.8s ease-in-out infinite;}
@keyframes outPulse{0%,100%{opacity:.3;}50%{opacity:.7;}}

.kpi-stats{display:flex;gap:0;margin-top:6px;border-top:1px solid var(--border);padding-top:5px;}
.kpi-stat{flex:1;text-align:center;}
.kpi-stat-lbl{font-size:7.5px;color:var(--muted);opacity:.8;display:block;line-height:1.2;font-weight:600;letter-spacing:.3px;}
.kpi-stat-val{font-size:9.5px;font-weight:700;color:var(--txt-dim);display:block;line-height:1.3;}
.kpi-stat+.kpi-stat{border-right:1px solid var(--border);}

      surgery:{emergency:agg('surgery.emergency'), routine:agg('surgery.routine'), waiting:agg('surgery.waiting'), cancelled:agg('surgery.cancelled'), cancel_reason:(function(){
        var reasons = wks.map(function(w){ return gv(w,'surgery.cancel_reason')||''; }).filter(function(v){ return v&&v!=='—'&&v!=='-'&&v!=='_'; });
        if(!reasons.length) return '—';
        var c={};
        function normCat(t){ return /^med\.?\s*ind/i.test(t) ? 'Medical Indication' : t; }
        reasons.forEach(function(r){
          if(r.indexOf('+')>0){ r.split('+').forEach(function(p){ var m=p.match(/^(\d+)\s*(.+)/); if(m){ var t=normCat(m[2].trim()); c[t]=(c[t]||0)+parseInt(m[1]); } else { var t=normCat(p.trim()); c[t]=(c[t]||0)+1; } }); }
          else if(r.indexOf('-')>0){ r.split(/\s*-\s*/).forEach(function(p){ var t=normCat(p.trim()); c[t]=(c[t]||0)+1; }); }
          else { var t=normCat(r.trim()); c[t]=(c[t]||0)+1; }
        });
        return Object.keys(c).map(function(k){ return c[k]+' '+k; }).join('+');
      })()},

      satisfaction:{all:agg('satisfaction.all'), ed:agg('satisfaction.ed'), clinics:agg('satisfaction.clinics'), inpatient:agg('satisfaction.inpatient')},
      complaints:{closed:agg('complaints.closed'), not_closed:agg('complaints.not_closed')},
      capacity:{inpatients:agg('capacity.inpatients'), bed_occ:agg('capacity.bed_occ'), lifesaving:agg('capacity.lifesaving'), emergency_ref:agg('capacity.emergency_ref'), routine_ref:agg('capacity.routine_ref')},

function aggregateData(arr){
  if(!arr || arr.length === 0) return null;
  if(arr.length === 1) return arr[0];
  var r = JSON.parse(JSON.stringify(arr[0]));
  for(var i = 1; i < arr.length; i++){
    Object.keys(FIELD_TYPE).forEach(function(path){
      if(FIELD_TYPE[path] === 'text') return;
      var p = path.split('.'), cat = p[0], f = p[1];
      if(!r[cat] || !arr[i][cat]) return;
      var v1 = r[cat][f], v2 = arr[i][cat][f];
      if(v2 === null || v2 === undefined || v2 === '-' || v2 === '—' || v2 === '_') return;
      v2 = +v2;
      if(isNaN(v2)) return;
      if(v1 === null || v1 === undefined || v1 === '-' || v1 === '—' || v1 === '_'){ r[cat][f] = v2; return; }
      v1 = +v1;
      if(isNaN(v1)){ r[cat][f] = v2; return; }
      var t = FIELD_TYPE[path];
      if(t === 'sum') r[cat][f] = v1 + v2;
      else if(t === 'avg') r[cat][f] = (v1 * i + v2) / (i + 1);
      else if(t === 'last') r[cat][f] = v2;
    });
  }
  return r;
}

function stat(fn, fromLabel){
  var vw = allData();
  if(fromLabel){
    var idx=0;
    for(var i=0; i<vw.length; i++){ if(vw[i].label===fromLabel){ idx=i; break; } }
    vw = vw.slice(idx);
  }
  var nums = vw.map(fn).filter(function(v){ return v!==null && v!==undefined && !isNaN(+v) && v!=='-' && v!=='—' && v!=='_'; }).map(Number);
  if(!nums.length) return {avg:'-', mn:'-', mx:'-'};
  var sum = nums.reduce(function(a,b){ return a+b; }, 0);
  var avg = sum/nums.length;
  var mn = Math.min.apply(null, nums), mx = Math.max.apply(null, nums);
  function fmt(v){ return v===Math.round(v) ? String(Math.round(v)) : (Math.round(v*10)/10).toFixed(1); }
  return {avg:fmt(avg), mn:fmt(mn), mx:fmt(mx)};
}

function kpiStats(fn, fromLabel){

    +'</div>';
}

function sparkline(dataFn, color){
  var vw = allData();
  var ns='http://www.w3.org/2000/svg';
  var W=90, H=26;
  var nums = vw.map(dataFn).map(function(v){ return (v===null||v===undefined||isNaN(+v)) ? null : +v; });
  var valid = nums.filter(function(v){ return v!==null; });
  if(valid.length < 2) return '';
  var mn = Math.min.apply(null, valid), mx = Math.max.apply(null, valid);
  var rng = mx-mn || 1;
  var n = nums.length;
  var pts = nums.map(function(v,i){
    return {x:(i/(n-1))*W, y:v===null ? null : H-2-((v-mn)/rng)*(H-4)};
  });
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  svg.setAttribute('preserveAspectRatio', 'none');
  var validPts = pts.filter(function(p){ return p.y!==null; });
  if(validPts.length >= 2){
    var d='M'+validPts[0].x+','+validPts[0].y;
    for(var i=1; i<validPts.length; i++){
      var cp1x = validPts[i-1].x + (validPts[i].x - validPts[i-1].x)*0.4;
      d += ' C'+cp1x+','+validPts[i-1].y+' '+(validPts[i].x-(validPts[i].x-validPts[i-1].x)*0.4)+','+validPts[i].y+' '+validPts[i].x+','+validPts[i].y;
    }
    var area = document.createElementNS(ns, 'path');
    area.setAttribute('d', d+' L'+validPts[validPts.length-1].x+','+(H-1)+' L'+validPts[0].x+','+(H-1)+' Z');
    area.setAttribute('fill', color); area.setAttribute('opacity', '.1'); svg.appendChild(area);
    var line = document.createElementNS(ns, 'path');
    line.setAttribute('d', d); line.setAttribute('stroke', color); line.setAttribute('stroke-width', '1.5'); line.setAttribute('fill', 'none');
    line.setAttribute('stroke-linejoin', 'round'); line.setAttribute('stroke-linecap', 'round'); svg.appendChild(line);
    var lp = validPts[validPts.length-1];
    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', lp.x); dot.setAttribute('cy', lp.y); dot.setAttribute('r', '2.5');
    dot.setAttribute('fill', color); svg.appendChild(dot);
  }
  var div = document.createElement('div'); div.className='kpi-spark'; div.appendChild(svg);
  return div.outerHTML;
}

function kpi(label, val, cls, curr, prev, statFn, statFrom, sparkFn, valId){
  var trend='';
  if(curr!==undefined && prev!==undefined && typeof curr==='number' && typeof prev==='number'){
    trend = pctChange(curr, prev);
  }
  var stats = statFn ? kpiStats(statFn, statFrom) : '';
  var sparkColor = {
    'v-r':'var(--red)','v-g':'var(--green)','v-a':'var(--amber)',
    'v-t':'var(--teal)','v-b':'var(--blue)','v-p':'var(--purple)',
    '':'var(--blue)'
  }[cls||''] || 'var(--blue)';
  var spark = sparkFn!==false && statFn ? sparkline(statFn, sparkColor) : '';
  var vid = valId ? ' data-val-id="'+valId+'"' : '';
  return '<div class="kpi"><div class="kpi-label">'+label+'</div><div class="kpi-row"><span class="kpi-val '+(cls||'')+'"'+vid+'>'+val+'</span>'+trend+'</div>'+spark+stats+'</div>';
}

/* ─── Animate counting ─── */
function animateValue(el, target, suffix, duration){
  var start = 0, startTime = null;
  duration = duration || 600;
  if(!el || isNaN(target)) return;
  el.textContent = '0' + (suffix||'');
  function step(ts){
    if(!startTime) startTime = ts;
    var pct = Math.min(1, (ts - startTime) / duration);
    var eased = 1 - Math.pow(1 - pct, 3);
    var cur = Math.round(start + (target - start) * eased);
    el.textContent = (target >= 1000 ? cur.toLocaleString() : cur) + (suffix||'');
    if(pct < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ─── Percentage change badge ─── */
function pctChange(curr, prev, decimals){
  if(curr===undefined || prev===undefined || typeof curr!=='number' || typeof prev!=='number' || prev===0) return '';
  decimals = decimals!==undefined ? decimals : 1;
  var pct = ((curr - prev) / Math.abs(prev)) * 100;
  if(Math.abs(pct) < 0.05) return '<span class="kpi-trend trend-flat">→ 0.0%</span>';
  var sym = pct > 0 ? '▲' : '▼';
  var cls = pct > 0 ? 'trend-up' : 'trend-dn';
  return '<span class="kpi-trend '+cls+'">'+sym+Math.abs(Math.round(pct*10)/10).toFixed(decimals)+'%</span>';
}

/* ─── Find outliers (simple z-score) ─── */
function findOutliers(data, threshold){
  if(!data || data.length < 3) return [];
  threshold = threshold || 1.5;
  var nums = data.filter(function(v){ return typeof v==='number' && !isNaN(v); });
  if(nums.length < 3) return [];
  var sum = nums.reduce(function(a,b){ return a+b; }, 0);
  var mean = sum / nums.length;
  var sqDiffs = nums.map(function(v){ return (v-mean)*(v-mean); });
  var variance = sqDiffs.reduce(function(a,b){ return a+b; }, 0) / nums.length;
  var std = Math.sqrt(variance) || 0.001;
  var result = [];
  data.forEach(function(v,i){
    if(typeof v!=='number' || isNaN(v)) return;
    var z = Math.abs(v - mean) / std;
    if(z > threshold) result.push(i);
  });
  return result;
}

/* ─── Stacked Bar for Screening ─── */
function makeStackedBar(data, colors, labels, maxVal, zeroNotes){
  var html = '<div class="stacked-bar-wrap">';
  data.forEach(function(item, idx){
    var total = item.total || 0;
    var pos = item.pos || 0;
    var neg = Math.max(0, total - pos);
    var pct = maxVal > 0 ? (total / maxVal) * 100 : 0;
    var posPct = total > 0 ? (pos / total) * 100 : 0;
    var note = (zeroNotes && zeroNotes[idx] && total === 0) ? '<span style="font-size:7px;color:var(--muted);margin-right:4px;">'+zeroNotes[idx]+'</span>' : '';
    html += '<div class="stacked-bar-row">'
      + '<span class="stacked-bar-lbl">'+labels[idx]+'</span>'
      + '<div class="stacked-bar-track">'
      + (total > 0 ? '<div class="stacked-bar-seg" style="width:'+(pct)+'%;background:'+colors.neg+';"></div>' : '<div style="height:100%;width:4px;background:var(--border);border-radius:4px;"></div>')
      + (pos > 0 ? '<div class="stacked-bar-seg" style="width:'+(posPct * (pct/100))+'%;background:'+colors.pos+';"></div>' : '')
      + '</div>'
      + '<span class="stacked-bar-val">'+total+' ('+pos+'+)'+note+'</span>'
      + '</div>';
  });

    svg.appendChild(val);

    lb.setAttribute('x', x + barW/2); lb.setAttribute('y', maxH + 13);
    lb.setAttribute('text-anchor', 'middle'); lb.setAttribute('font-size', '9');
    lb.setAttribute('font-weight', '600'); lb.setAttribute('fill', 'var(--txt-dim)');
    lb.textContent = item.label;
    svg.appendChild(lb);
  });
  return svg;
}

/* ─── KPI Rows Builder for Quick Cards ─── */
function gpo(obj, path){
  return path.split('.').reduce(function(o, k){ return o && o[k] !== undefined ? o[k] : null; }, obj);
}
function makeStatFn(p){
  return function(w){ var v = gpo(w, p); return (v==='-'||v==='—'||v===null||v===undefined)?0:+v; };
}
function donutCardWithKPI(title, donutSvg, segments, paths, type, chartType){
  type = type || 'donut';
  var kpis = buildKPIGrid(segments, paths);
  var dtIcons = chartType ? '<div class="quick-dtl"><button class="detail-btn" onclick="toggleQuickDetail(\''+chartType+'\',false,event)">📈 الرسم البياني</button><button class="detail-btn" onclick="toggleQuickDetail(\''+chartType+'\',true,event)">📋 جدول الأرقام</button></div>' : '';
  var genericData = encodeURIComponent(JSON.stringify([{type:'donut'}]));
  return '<div class="quick-card quick-zoom-trigger" data-zoom-title="'+title+'" data-zoom-type="generic" data-zoom-html="'+genericData+'"><div class="quick-card-title">'+title+'</div><div class="quick-card-content"><span class="quick-zoom-hint">🔍</span>'+donutSvg.outerHTML+kpis+dtIcons+'</div></div>';
}
function buildKPIGrid(segments, paths){
  if(!segments || !segments.length) return '';
  var allW = allData();
  var lw = getOverviewMonthData();
  var curIdx = -1;
  for(var i=0;i<allW.length;i++){ if(allW[i].label===lw.label){ curIdx=i; break; } }
  var prevW = curIdx>0 ? allW[curIdx-1] : null;
  var clsMap = {'var(--red)':'v-r','var(--green)':'v-g','var(--amber)':'v-a','var(--blue)':'v-b','var(--teal)':'v-t','var(--purple)':'v-p'};
  var kpis = segments.map(function(s, i){
    var p = paths && paths[i] ? paths[i] : null;
    if(!p) return '';
    var cls = clsMap[s.color] || '';
    var curr = +s.value||0;
    var prev = prevW ? (+gpo(prevW, p)||0) : undefined;
    var statFn = makeStatFn(p);
    var kh = kpi(s.label, ''+s.value, cls, curr, prev, statFn);
    if(p) kh = kh.replace('<div class="kpi"', '<div class="kpi" data-path="'+p+'"');
    return kh;
  }).join('');
  return '<div class="kpi-grid" style="width:100%;margin-top:4px;">'+kpis+'</div>';
}
function qCardZoomKPI(title, content, segments, paths, data, chartType){
  var enc = data ? encodeURIComponent(JSON.stringify(data)) : '';
  var kpis = buildKPIGrid(segments, paths);
  var dtIcons = chartType ? '<div class="quick-dtl"><button class="detail-btn" onclick="toggleQuickDetail(\''+chartType+'\',false,event)">📈 الرسم البياني</button><button class="detail-btn" onclick="toggleQuickDetail(\''+chartType+'\',true,event)">📋 جدول الأرقام</button></div>' : '';
  return '<div class="quick-card quick-zoom-trigger" data-zoom-title="'+title+'" data-zoom-type="generic" data-zoom-html="'+enc+'"><div class="quick-card-title">'+title+'</div><div class="quick-card-content"><span class="quick-zoom-hint">🔍</span>'+content+kpis+dtIcons+'</div></div>';
}
function toggleQuickDetail(chartType, isTable, e){
  try{
    if(e) e.stopPropagation();
    var cont = document.getElementById('zoomChartContainer');
    var titleEl = document.getElementById('zoomTitle');
    if(!cont || !titleEl) return;
    if(isTable){
      var isMobile = window.innerWidth <= 700;
      var targetId = (isMobile ? 'mpnl-' : 'dpnl-') + chartType + '-tbl';
      var panel = document.getElementById(targetId);
      if(!panel) return;
      cont.innerHTML = '';
      var inner = panel.querySelector('.inline-inner, .detail-inner');
      if(inner){ var clone = inner.cloneNode(true); clone.style.cssText = 'width:100%;overflow-x:auto;'; cont.appendChild(clone); }
      else { cont.innerHTML = panel.innerHTML; }
      titleEl.textContent = '📋 جدول الأرقام';
    } else {
      var def = CHART_DEFS[chartType]; if(!def) return;
      var lb = labels(), col = getColors();
      var result = def(col);
      var datasets = result.datasets || result;
      var opts = Object.assign({}, result.opts || datasets.__opts || {});
      opts.H = 420;
      var svg = makeComboSVG(lb, datasets, opts);
      var vbW = parseInt(svg.getAttribute('width')) || 700;
      var zoomed = Math.max(vbW, Math.min(window.innerWidth*0.88, 1060));
      var maxH = window.innerHeight * 0.7;
      var scl = Math.min(zoomed / vbW, maxH / opts.H);
      svg.setAttribute('width', Math.round(vbW * scl));
      svg.setAttribute('height', Math.round(opts.H * scl));
      svg.setAttribute('viewBox', '0 0 '+vbW+' '+opts.H);
      cont.innerHTML = '';
      cont.appendChild(svg);
      if(datasets.length){
        var zLegDiv = document.createElement('div');
        zLegDiv.innerHTML = buildHtmlLegend(datasets);
        cont.appendChild(zLegDiv.firstChild);
      }
      titleEl.textContent = '📈 الرسم البياني';
    }
    document.getElementById('zoomModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  } catch(e2){}
}

function openKpiZoom(kpiEl, path){
  var labelEl = kpiEl.querySelector('.kpi-label');
  var metricLabel = labelEl ? labelEl.textContent : path;
  var allW = allData();
  var data = allW.map(function(w){ var v = gpo(w, path); return (v==='-'||v===null||v===undefined)?0:+v; });
  var lbls = allW.map(function(w){ return w.label; });
  var col = getColors();
  var numVals = data.filter(function(v){ return !isNaN(v); });
  var minVal = numVals.length ? Math.min.apply(null, numVals) : 0;
  var maxVal = numVals.length ? Math.max.apply(null, numVals) : 0;
  var avgVal = numVals.length ? numVals.reduce(function(a,b){ return a+b; }, 0) / numVals.length : 0;
  var datasets = [
    {label: metricLabel, type: 'line', data: data, color: col.blue},
    {label: 'المتوسط: '+avgVal.toFixed(1), type: 'line', data: data.map(function(){ return avgVal; }), color: col.green, dashed: true, showVals: false},
    {label: 'الحد الأعلى: '+maxVal, type: 'line', data: data.map(function(){ return maxVal; }), color: col.red, dashed: true, showVals: false},
    {label: 'الحد الأدنى: '+minVal, type: 'line', data: data.map(function(){ return minVal; }), color: col.amber, dashed: true, showVals: false}
  ];
  var opts = {H: 420};
  var svg = makeComboSVG(lbls, datasets, opts);
  var vbW = parseInt(svg.getAttribute('width')) || 700;
  var zoomed = Math.max(vbW, Math.min(window.innerWidth*0.88, 1060));
  var maxH = window.innerHeight * 0.7;
  var scl = Math.min(zoomed / vbW, maxH / opts.H);
  svg.setAttribute('width', Math.round(vbW * scl));
  svg.setAttribute('height', Math.round(opts.H * scl));
  svg.setAttribute('viewBox', '0 0 '+vbW+' '+opts.H);
  var cont = document.getElementById('zoomChartContainer');
  cont.innerHTML = '';
  cont.appendChild(svg);
  if(datasets.length){
    var legDiv = document.createElement('div');
    legDiv.innerHTML = buildHtmlLegend(datasets);
    cont.appendChild(legDiv.firstChild);
  }
  document.getElementById('zoomTitle').textContent = '📈 ' + metricLabel + ' — الحد الأدنى/الأقصى/المتوسط';
  document.getElementById('zoomModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* ─── COMBO SVG CHART ENGINE ─── */
var CHART_DEFS={};
function registerChart(type, fn){ CHART_DEFS[type]=fn; }
function buildChartById(id, type){
  var def = CHART_DEFS[type]; if(!def) return;
  var lb = labels(), col = getColors();
  var result = def(col);
  var datasets = result.datasets || result;
  var opts = result.opts || datasets.__opts || {};
  mountChart(id, makeComboSVG(lb, datasets, opts), type);
}
function buildHtmlLegend(datasets){
  var html = '<div class="chart-legend">';
  datasets.forEach(function(ds){
    var isBar = ds.type==='bar';
    var icon = isBar
      ? '<span class="leg-icon leg-sq" style="background:'+ds.color+'"></span>'
      : '<span class="leg-icon leg-ci" style="background:'+ds.color+'"></span>';
    html += '<span class="leg-item">'+icon+'<span class="leg-lbl">'+ds.label+'</span></span>';
  });
  html += '</div>';
  return html;
}

function mountChart(id, svg, chartType){
  var c = document.getElementById(id); if(!c) return;
  c.innerHTML = '';
  var s = document.createElement('div'); s.className='chart-scroll'; s.appendChild(svg); c.appendChild(s);
  var datasets = svg._datasets || [];
  if(datasets.length){
    var legDiv = document.createElement('div');
    legDiv.innerHTML = buildHtmlLegend(datasets);
    c.appendChild(legDiv.firstChild);
  }
  s.addEventListener('mousedown', function(){ s.style.cursor='grabbing'; });
  document.addEventListener('mouseup', function(){ s.style.cursor='grab'; });
  c.dataset.chartType = chartType||'';
}

function openZoom(chartType, title){
  var def = CHART_DEFS[chartType]; if(!def) return;
  var lb = labels(), col = getColors();
  var result = def(col);
  var datasets = result.datasets || result;
  var opts = Object.assign({}, result.opts || datasets.__opts || {});
  opts.H = 420;
  var svg = makeComboSVG(lb, datasets, opts);
  var vbW = parseInt(svg.getAttribute('width')) || 700;
  var zoomed = Math.max(vbW, Math.min(window.innerWidth*0.88, 1060));
  var maxH = window.innerHeight * 0.7;
  var scl = Math.min(zoomed / vbW, maxH / opts.H);
  svg.setAttribute('width', Math.round(vbW * scl));
  svg.setAttribute('height', Math.round(opts.H * scl));
  svg.setAttribute('viewBox', '0 0 '+vbW+' '+opts.H);
  var cont = document.getElementById('zoomChartContainer');
  cont.innerHTML = '';
  cont.appendChild(svg);
  if(datasets.length){
    var zLegDiv = document.createElement('div');
    zLegDiv.innerHTML = buildHtmlLegend(datasets);
    cont.appendChild(zLegDiv.firstChild);
  }
  document.getElementById('zoomTitle').textContent = '📈 '+title;
  var modal = document.getElementById('zoomModal');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openQuickZoom(title, segments, type){
  var maxH = window.innerHeight * 0.7;
  var maxW = Math.min(window.innerWidth * 0.7, 500);
  var size;
  if(type === 'pie'){
    size = Math.min(maxW, maxH / 1.35);
  } else {
    size = Math.min(maxW, maxH / 1.24);
  }
  size = Math.round(Math.min(size, 380));
  var svg;
  if(type === 'pie'){
    svg = makeQuickPie(segments, size);
  } else {
    svg = makeDonut(segments, size);
  }
  svg.style.width = 'min(100%, '+(size+Math.round(size*0.32))+'px)';
  svg.style.height = 'auto';
  var cont = document.getElementById('zoomChartContainer');
  cont.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:100%;padding:0;';
  wrap.appendChild(svg);
  cont.appendChild(wrap);
  document.getElementById('zoomTitle').textContent = '📊 '+title;
  document.getElementById('zoomModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeZoom(e){
  if(e && e.target && e.target !== document.getElementById('zoomModal')) return;
  document.getElementById('zoomModal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeZoom({}); });

          inner.querySelectorAll('.hbar-lbl, .hbar-val').forEach(function(l){ l.style.fontSize = '16px'; });

        }

document.addEventListener('click', function(e){

function makeComboSVG(lbls, datasets, opts){
  opts = opts || {};
  var ns = 'http://www.w3.org/2000/svg', n = lbls.length;
  var col = getColors();
  var H = opts.H || 270;
  var legH = 0;
  var hasDualY = datasets.some(function(d){ return d.yAxis === 'right'; });
  var MR = hasDualY ? 46 : 40;
  var ML = hasDualY ? 46 : 10;
  var MT = 16, MB = 18;
  var minW = Math.max(360, n*72 + ML + MR + 20);
  var W = minW;
  var cTop = MT, cBot = H - legH - MB;
  var cLeft = ML, cRight = W - MR, cW = cRight - cLeft, cH = cBot - cTop;

  function yRange(axis){
    var vs = [];
    datasets.forEach(function(d){ if((d.yAxis||'primary') === axis){ vs = vs.concat(d.data.map(function(v){ return isNaN(+v) ? 0 : +v; })); } });
    if(!vs.length) return {min:0, max:1};
    var mx = Math.max.apply(null, vs), mn = opts.minV!==undefined && axis==='primary' ? opts.minV : 0;
    if(opts.isPercent && axis==='primary'){ mn = opts.minV || 60; mx = opts.maxV || 100; }
    if(axis==='right'){ mn = 0; mx = opts.rightMaxV || Math.max(mx*1.2, 1); }
    else { mx = opts.maxV || (mx*1.15) || 1; }
    return {min:mn, max:mx};
  }
  var scP = yRange('primary'), scR = yRange('right');

  function toY(v, axis){
    var sc = (axis||'primary') === 'primary' ? scP : scR;
    var num = isNaN(+v) ? 0 : +v;
    var ratio = sc.max > sc.min ? (num - sc.min) / (sc.max - sc.min) : 0;
    return cBot - ratio * cH;
  }

  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);

  var steps = 5;
  for(var s=0; s<=steps; s++){
    var gy = cBot - (s/steps) * cH;
    var gl = document.createElementNS(ns, 'line');
    gl.setAttribute('x1', cLeft); gl.setAttribute('y1', gy); gl.setAttribute('x2', cRight); gl.setAttribute('y2', gy);
    gl.setAttribute('stroke', s===0 ? (isLight?'rgba(60,100,140,.3)':'rgba(255,255,255,.12)') : (isLight?'rgba(60,100,140,.07)':'rgba(255,255,255,.04)'));
    gl.setAttribute('stroke-width', '1'); svg.appendChild(gl);
    var lv = scP.min + (s/steps) * (scP.max - scP.min);
    var lt = document.createElementNS(ns, 'text');
    lt.setAttribute('x', cRight+4); lt.setAttribute('y', gy+3.5);
    lt.setAttribute('text-anchor', 'start'); lt.setAttribute('font-size', '8');
    lt.setAttribute('fill', col.muted); lt.setAttribute('opacity', '.75');
    lt.textContent = opts.isPercent ? Math.round(lv)+'%' : (lv>=1000 ? (lv/1000).toFixed(1)+'k' : Math.round(lv));
    svg.appendChild(lt);
    if(hasDualY){
      var lv2 = scR.min + (s/steps) * (scR.max - scR.min);
      var lt2 = document.createElementNS(ns, 'text');
      lt2.setAttribute('x', cLeft-4); lt2.setAttribute('y', gy+3.5);
      lt2.setAttribute('text-anchor', 'end'); lt2.setAttribute('font-size', '8');
      lt2.setAttribute('fill', col.teal); lt2.setAttribute('opacity', '.75');
      var rightIsRaw = datasets.some(function(d){ return d.yAxis==='right' && d.showRawOnRight; });
      lt2.textContent = rightIsRaw ? (lv2>=1000 ? (lv2/1000).toFixed(1)+'k' : Math.round(lv2)) : Math.round(lv2)+'%';
      svg.appendChild(lt2);
    }
  }

  var barDatasets = datasets.filter(function(d){ return d.type === 'bar'; });
  var barCount = barDatasets.length;
  var totalBarW = Math.min(cW/(n||1)*0.38, 26*barCount);
  var singleBarW = barCount > 0 ? Math.max(8, totalBarW/barCount) : 0;

  function barX(dsIndex, i){
    var groupCenter = cLeft + (n===1 ? cW/2 : i*(cW/(n-1)));
    var offset = (dsIndex - (barCount-1)/2) * singleBarW;
    return groupCenter + offset - singleBarW/2;
  }

  function smoothPath(pts){
    if(pts.length < 2) return 'M'+pts[0].x+','+pts[0].y;
    var d = 'M'+pts[0].x+','+pts[0].y;
    for(var i=1; i<pts.length; i++){
      var cp1x = pts[i-1].x + (pts[i].x - pts[i-1].x)*0.42, cp1y = pts[i-1].y;
      var cp2x = pts[i].x - (pts[i].x - pts[i-1].x)*0.42, cp2y = pts[i].y;
      d += ' C'+cp1x+','+cp1y+' '+cp2x+','+cp2y+' '+pts[i].x+','+pts[i].y;
    }
    return d;
  }

  var barIdx = 0;
  var allLabelBoxes = [];

  function noCollide(cx, cy, tw, th, prefer){
    var candidates;
    if(prefer === 'above')
      candidates = [cy-11, cy-23, cy-35, cy+14, cy+26];
    else
      candidates = [cy+14, cy-11, cy+26, cy-23];

    for(var ci=0; ci<candidates.length; ci++){
      var ly = candidates[ci];
      ly = Math.min(ly, cBot-3);
      ly = Math.max(ly, cTop+10);
      var box = {x:cx-tw/2-1, y:ly-9, w:tw+2, h:12};
      var ok = true;
      for(var bi=0; bi<allLabelBoxes.length; bi++){
        var b = allLabelBoxes[bi];
        if(box.x < b.x+b.w && box.x+box.w > b.x && box.y < b.y+b.h && box.y+b.h > b.y){ ok=false; break; }
      }
      if(ok){ allLabelBoxes.push(box); return ly; }
    }
    var ly0 = Math.max(cTop+10, Math.min(cy-11, cBot-3));
    allLabelBoxes.push({x:cx-tw/2-1, y:ly0-9, w:tw+2, h:12});
    return ly0;
  }

  datasets.forEach(function(ds){
    if(ds.type !== 'bar') return;
    var bx = barIdx++;
    var labelPos = ds.labelPos || opts.barLabelPos || 'inside-bottom';
    ds.data.forEach(function(v, i){
      var numV = isNaN(+v) ? 0 : +v;
      var y = toY(numV, ds.yAxis || 'primary');
      var x = barX(bx, i);
      var bh = Math.max(0, cBot - y);
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', x); rect.setAttribute('y', y);
      rect.setAttribute('width', singleBarW - 2); rect.setAttribute('height', bh);
      rect.setAttribute('rx', '3'); rect.setAttribute('fill', ds.color); rect.setAttribute('opacity', '0.72');
      svg.appendChild(rect);

      var fmt = numV >= 1000 ? (numV/1000).toFixed(1)+'k' : String(numV);
      if(ds.yAxis === 'right' && !ds.showRawOnRight){
        fmt = (ds.integerLabel ? Math.round(numV) : numV) + '%';
      }
      var bw2 = fmt.length * 5 + 8;
      var lx2 = x + singleBarW/2 - 1;
      var ly;

      if(labelPos === 'above'){
        if(numV === 0){
          ly = cBot - 3;
          allLabelBoxes.push({x:lx2-bw2/2-1, y:ly-9, w:bw2+2, h:12});
        } else {
          ly = noCollide(lx2, y, bw2, 11, 'above');
        }
      } else if(labelPos === 'inside-center'){
        if(bh > 14){
          ly = y + bh/2 + 4;
          ly = Math.min(ly, cBot-3); ly = Math.max(ly, cTop+10);
          allLabelBoxes.push({x:lx2-bw2/2-1, y:ly-9, w:bw2+2, h:12});
        } else {
          ly = noCollide(lx2, y, bw2, 11, 'above');
        }
      } else {
        if(bh > 16){
          ly = cBot - 6;
          allLabelBoxes.push({x:lx2-bw2/2-1, y:ly-9, w:bw2+2, h:12});
        } else {
          ly = noCollide(lx2, y, bw2, 11, 'above');
        }
      }

      var bgOpacity = (numV === 0) ? 0.45 : 0.82;
      var pbg = document.createElementNS(ns, 'rect');
      pbg.setAttribute('x', lx2-bw2/2); pbg.setAttribute('y', ly-9);
      pbg.setAttribute('width', bw2); pbg.setAttribute('height', 11); pbg.setAttribute('rx', '5');
      pbg.setAttribute('fill', ds.color); pbg.setAttribute('opacity', String(bgOpacity));
      svg.appendChild(pbg);
      var lbl = document.createElementNS(ns, 'text');
      lbl.setAttribute('x', lx2); lbl.setAttribute('y', ly+0.5);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '7'); lbl.setAttribute('font-weight', '800');
      lbl.setAttribute('fill', isLight ? '#0a1825' : '#050e1a');
      lbl.textContent = fmt; svg.appendChild(lbl);
    });
  });

  datasets.forEach(function(ds){
    if(ds.type === 'bar') return;
    var axis = ds.yAxis || 'primary';
    var isDashed = ds.dashed;
    var gapIndex = ds.gapIndex;

    var rawData = ds.data;
    var allPts = rawData.map(function(v, i){
      var numV = (v===null || v===undefined) ? null : isNaN(+v) ? null : +v;
      return {x:cLeft + (n===1 ? cW/2 : i*(cW/(n-1))), y:numV!==null ? toY(numV, axis) : null, v:numV, i:i};
    });

    var solidPts = allPts.filter(function(p){ return p.v!==null && (gapIndex===undefined || p.i!==gapIndex); });
    if(!isDashed && solidPts.length >= 2){
      var area = document.createElementNS(ns, 'path');
      area.setAttribute('d', smoothPath(solidPts) + ' L'+solidPts[solidPts.length-1].x+','+cBot+' L'+solidPts[0].x+','+cBot+' Z');
      area.setAttribute('fill', ds.color); area.setAttribute('opacity', '.06'); svg.appendChild(area);
    }

    if(gapIndex !== undefined){
      var before = allPts.filter(function(p){ return p.i < gapIndex && p.v !== null; });
      var after = allPts.filter(function(p){ return p.i > gapIndex && p.v !== null; });
      var gapPt = allPts[gapIndex];
      var beforeLast = before.length ? before[before.length-1] : null;
      var afterFirst = after.length ? after[0] : null;

      function drawSeg(pts, dsh){
        if(pts.length < 1) return;
        var lp = document.createElementNS(ns, 'path');
        lp.setAttribute('d', pts.length===1 ? 'M'+pts[0].x+','+pts[0].y : smoothPath(pts));
        lp.setAttribute('stroke', ds.color); lp.setAttribute('stroke-width', '2'); lp.setAttribute('fill', 'none');
        lp.setAttribute('stroke-linejoin', 'round'); lp.setAttribute('stroke-linecap', 'round');
        if(dsh) lp.setAttribute('stroke-dasharray', '5,4');
        svg.appendChild(lp);
      }
      drawSeg(before, false);
      if(beforeLast && afterFirst){
        var bridge = [];
        if(beforeLast) bridge.push(beforeLast);
        if(gapPt && gapPt.v === null){
          var midY = (beforeLast.y + afterFirst.y) / 2;
          bridge.push({x:gapPt.x, y:midY});
        }
        if(afterFirst) bridge.push(afterFirst);
        drawSeg(bridge, true);
      }
      drawSeg(after, false);
    } else {
      var validPts = allPts.filter(function(p){ return p.v !== null; });
      if(validPts.length < 1) return;
      var lp = document.createElementNS(ns, 'path');
      lp.setAttribute('d', validPts.length===1 ? 'M'+validPts[0].x+','+validPts[0].y : smoothPath(validPts));
      lp.setAttribute('stroke', ds.color); lp.setAttribute('stroke-width', '2'); lp.setAttribute('fill', 'none');
      lp.setAttribute('stroke-linejoin', 'round'); lp.setAttribute('stroke-linecap', 'round');
      if(isDashed) lp.setAttribute('stroke-dasharray', '6,4');
      svg.appendChild(lp);
    }

    allPts.forEach(function(p){
      if(p.v === null) return;
      var isDashedPt = (gapIndex!==undefined && p.i===gapIndex);
      if(isDashedPt) return;
      var dot = document.createElementNS(ns, 'circle');
      dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y); dot.setAttribute('r', '3.5');
      dot.setAttribute('fill', ds.color);
      dot.setAttribute('stroke', isLight ? 'rgba(240,245,251,.9)' : 'rgba(5,14,26,.9)');
      dot.setAttribute('stroke-width', '1.6'); svg.appendChild(dot);

      if(ds.showVals !== false){
        var fmt = opts.isPercent ? Math.round(p.v)+'%' : (p.v>=1000 ? (p.v/1000).toFixed(1)+'k' : String(p.v));
        if(axis === 'right') fmt = p.v + '%';
        var tw = fmt.length * 5 + 8;
        var prefer = p.y > cTop+22 ? 'above' : 'below';
        var ly = noCollide(p.x, p.y, tw, 11, prefer);
        var bg = document.createElementNS(ns, 'rect');
        bg.setAttribute('x', p.x-tw/2); bg.setAttribute('y', ly-9); bg.setAttribute('width', tw); bg.setAttribute('height', 11); bg.setAttribute('rx', '3');
        bg.setAttribute('fill', isLight ? 'rgba(240,245,251,.68)' : 'rgba(5,14,26,.62)'); svg.appendChild(bg);
        var vt = document.createElementNS(ns, 'text');
        vt.setAttribute('x', p.x); vt.setAttribute('y', ly+0.5); vt.setAttribute('text-anchor', 'middle');
        var lfs = opts.lineLabelSize || 8;
        vt.setAttribute('font-size', lfs); vt.setAttribute('font-weight', '700'); vt.setAttribute('fill', ds.color);
        vt.textContent = fmt; svg.appendChild(vt);
      }
    });
  });

  for(var i=0; i<n; i++){
    var xt = document.createElementNS(ns, 'text');
    xt.setAttribute('x', cLeft + (n===1 ? cW/2 : i*(cW/(n-1)))); xt.setAttribute('y', cBot+12);
    xt.setAttribute('text-anchor', 'middle'); xt.setAttribute('font-size', '8.5'); xt.setAttribute('fill', col.muted);
    xt.textContent = lbls[i]; svg.appendChild(xt);
  }

  svg._datasets = datasets;
  return svg;
}

function row(lbl, fn, cls){ cls=cls||''; var cells = allData().slice().reverse().map(function(w,i){ var v=fn(w), wc=i===0?'w-last':''; return '<td class="'+cls+' '+wc+'">'+(typeof v==='number'?String(v):v)+'</td>'; }).join(''); return '<tr><td style="text-align:right">'+lbl+'</td>'+cells+'</tr>'; }

function fmtCancelReason(r){
  if(!r || r==='—' || r==='-' || r==='_') return '—';
  var counts = {};
  function normCat(cat){
    if(/^med\.?\s*ind/i.test(cat)) cat = 'Medical Indication';
    return cat;
  }
  if(r.indexOf('+') > 0){
    r.split('+').forEach(function(p){
      var m = p.match(/^(\d+)\s*(.*)/);
      if(m){ var cat = normCat(m[2].trim()); counts[cat] = (counts[cat]||0) + parseInt(m[1]); }
      else { var cat = normCat(p.trim()); counts[cat] = (counts[cat]||0) + 1; }
    });
  } else if(r.indexOf('-') > 0){
    r.split(/\s*-\s*/).forEach(function(p){ var cat = normCat(p.trim()); counts[cat] = (counts[cat]||0) + 1; });
  } else {
    var m2 = r.match(/^(\d+)\s+(.*)/);
    if(m2){ var cat = normCat(m2[2].trim()); counts[cat] = (counts[cat]||0) + parseInt(m2[1]); }
    else { var cat = normCat(r.trim()); counts[cat] = (counts[cat]||0) + 1; }
  }
  return Object.keys(counts).map(function(k){ return k+':<b>'+counts[k]+'</b>'; }).join(' | ');
}

function init(){
  try{
    var vw = getVW();
    if(!vw || vw.length === 0) { vw = [WEEKS[WEEKS.length-1]]; }
    LW = vw[vw.length-1];
    PW = vw.length >= 2 ? vw[vw.length-2] : null;
    if(!LW) { LW = WEEKS[WEEKS.length-1]; }

    reg();
    var mc = document.getElementById('main-content');
    var ms = document.getElementById('month-summary');
    var msHtml = ms ? ms.outerHTML : '<div class="month-summary" id="month-summary"></div>';
    mc.innerHTML = msHtml + buildHTML();
    var mLbl = document.getElementById('monthBtnLabel');
    if(mLbl) mLbl.textContent = viewMode==='monthly' ? (selectedMonth || '📊 كل الشهور') : '📊 كل الشهور';
    var wLbl = document.getElementById('weekBtnLabel');
    if(wLbl) wLbl.textContent = WK_LABELS[visibleCount] || visibleCount+' أسابيع';
    document.querySelectorAll('.wk-opt').forEach(function(o){ o.classList.toggle('sel', parseInt(o.getAttribute('data-n'))===visibleCount); });
    buildMonthlySummary();

    var sub = document.getElementById('topbar-sub');
    if(viewMode === 'monthly'){
      var monthNames = vw.map(function(w){ return w.label; }).join(' → ');
      sub.textContent = 'العرض الشهري — ' + monthNames;
    } else {
      sub.textContent = 'العرض الأسبوعي — ' + vw.length + ' أسابيع (' + vw[0].label + ' → ' + vw[vw.length-1].label + ')';
    }
    var tt = document.querySelector('.topbar-title');
    if(tt){
      var span = tt.querySelector('span:not(.topbar-dot)');
      if(!span){ span = document.createElement('span'); tt.appendChild(span); }
      span.textContent = viewMode === 'monthly' ? 'تقرير الأداء الشهري — المستشفى' : 'تقرير الأداء الأسبوعي — المستشفى';
    }

    document.getElementById('vt-weekly').classList.toggle('active', viewMode==='weekly');
    document.getElementById('vt-monthly').classList.toggle('active', viewMode==='monthly');
    var ws = document.getElementById('weekSelector');
    var ms2 = document.getElementById('monthSelector');
    if(ws) ws.style.display = viewMode==='monthly' ? 'none' : '';
    if(ms2) ms2.style.display = viewMode==='monthly' ? '' : 'none';

    /* ─── Animate KPI values ─── */
    setTimeout(function(){
      document.querySelectorAll('.kpi-val[data-val-id]').forEach(function(el){
        var target = parseFloat(el.textContent.replace(/[^0-9.\-]/g,''));
        if(!isNaN(target)){ animateValue(el, Math.round(target), el.textContent.replace(/[\d,.\-]/g,'').trim(), 500); }
      });
      /* also animate elements without data-val-id */
      document.querySelectorAll('.kpi-val:not([data-val-id])').forEach(function(el){
        var txt = el.textContent.trim();
        var num = parseFloat(txt.replace(/[^0-9.\-]/g,''));
        if(!isNaN(num) && num > 0){ el.setAttribute('data-val-id','auto'); animateValue(el, Math.round(num), txt.replace(/[\d,.\-]/g,'').trim(), 500); }
      });
    }, 100);

    /* ─── Update timestamp ─── */
    var ft = document.getElementById('footerTimestamp');
    if(ft){ var now = new Date(); ft.textContent = '🔄 آخر تحديث: '+now.toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})+' '+now.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}); }
  } catch(e){
    var fb = document.getElementById('main-content');
    if(fb) fb.innerHTML = '<div class="month-summary" id="month-summary"></div><div style="padding:20px;color:#ff5f6b;font-family:monospace;direction:ltr;font-size:12px">Error: '+String(e)+'<br>'+e.stack+'</div>';
  }
}

/* ─── Scroll-based: back-to-top + bottom nav active ─── */
(function(){
  var backTop = document.getElementById('backTop');
  var ticking = false, lastKnown = 0;
  var navSections = [
    {id:'sec-quality',label:'الجودة'},
    {id:'sec-emergency',label:'الطوارئ'},
    {id:'sec-surgery',label:'الجراحة'},
    {id:'sec-clinics',label:'العيادات'},
    {id:'sec-satisfaction',label:'الرضا'},
    {id:'sec-capacity',label:'الطاقة'},
    {id:'sec-pharmacy',label:'الصيدلية'},
    {id:'sec-screening',label:'الفحوصات'},
    {id:'sec-urgent',label:'العاجلة'},
    {id:'sec-home',label:'المنزلية'},
    {id:'sec-smoking',label:'التدخين'},
    {id:'sec-endo',label:'التنظير'}
  ];
  function onScroll(){
    lastKnown = window.pageYOffset;
    if(!ticking){
      requestAnimationFrame(function(){
        var y = lastKnown;
        if(backTop) backTop.classList.toggle('show', y > 300);
        var th = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--top-h')) || 54;
        var offset = th + 20;
        var activeId = null;
        for(var i=navSections.length-1; i>=0; i--){
          var el = document.getElementById(navSections[i].id);
          if(el && el.offsetTop - offset <= y){ activeId = navSections[i].id; break; }
        }

        ticking = false;
      });
      ticking = true;
    }
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  /* run once after init to set initial state */
  setTimeout(onScroll, 300);
})();
init();
</script>
